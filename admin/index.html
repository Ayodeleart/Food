<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D1B19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Burger Admin</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600;700&display=swap">
<style>
:root{--rust:#C34725;--ink:#1D1B19;--cream:#FFFCF7;--line:#EFE6DA;--mut:#6F665E;--ok:#2E8B57}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font-family:'Saira Semi Condensed',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom,0px)}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#FFF3DB;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0}
header h1{margin:0 0 10px;font-size:22px;letter-spacing:.3px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;border:0;background:none;color:#cdbfa8;font:600 15px inherit;font-family:inherit;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:#fff;border-color:var(--rust)}
main{max-width:980px;margin:0 auto;padding:16px}
h2{font-size:20px;margin:22px 0 10px}
.note{background:#FFF1E6;border:1px solid #F3D3B8;color:#7a3b17;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.cat h3{margin:0 0 10px;font-size:16px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.th{height:92px;border-radius:10px;background:conic-gradient(#f3ece2 25%,#fff 0 50%,#f3ece2 0 75%,#fff 0) 0 0/14px 14px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--mut);font-size:12px}
.th img{max-width:100%;max-height:100%;object-fit:contain}
.sl{font-size:12px;font-weight:600;color:var(--mut);margin:6px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.b{border:0;border-radius:9px;background:var(--rust);color:#fff;font:600 14px inherit;font-family:inherit;padding:9px 12px;min-height:38px;cursor:pointer}
.b.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.b:disabled{opacity:.55;cursor:default}
.in,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-size:16px;padding:10px 12px;min-height:44px}
textarea{min-height:110px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.row .n{flex:1 1 140px;width:auto}
.row .p{flex:0 0 96px;width:96px}
.row .d{flex:1 1 100%;width:100%}
.thm{width:52px;height:52px;flex:none;border-radius:10px;background:conic-gradient(#f3ece2 25%,#fff 0 50%,#f3ece2 0 75%,#fff 0) 0 0/12px 12px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:11px;color:var(--mut)}
.thm img{max-width:100%;max-height:100%;object-fit:contain}
.add{display:grid;grid-template-columns:1fr 110px auto;gap:8px;margin:8px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
label.chk{display:flex;gap:8px;align-items:center;margin:10px 0;font-weight:600}
label.chk.sm{font-size:13px;margin:8px 0 0;color:var(--mut)}
label.chk.sm input{width:18px;height:18px;margin:0}
.muted{color:var(--mut);font-size:14px}
#busy{position:fixed;inset:0;z-index:30;background:rgba(29,27,25,.6);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;color:#fff;font-weight:600;font-size:18px;text-align:center;padding:24px}
#busy.on{display:flex}
.spin{width:50px;height:50px;border-radius:50%;border:5px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:15px;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.show{opacity:1}
#toast.err{background:#a8281a}
.nf{display:flex;gap:10px;margin:8px 0}
.nfields{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.pickb{width:104px;flex:none;min-height:104px;border:1.5px dashed #cdbfa8;border-radius:12px;background:conic-gradient(#f3ece2 25%,#fff 0 50%,#f3ece2 0 75%,#fff 0) 0 0/14px 14px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;color:var(--mut);font:600 13px inherit;font-family:inherit;line-height:1.3;cursor:pointer;padding:6px}
.pickb img{max-width:100%;max-height:100%;object-fit:contain}
.frw{display:flex;flex:1 1 100%;align-items:center;gap:10px;font-size:14px;color:var(--mut)}
.frw span{flex:none}
.frw select{flex:1;min-width:0}
</style>
</head>
<body>
<header>
  <h1>Burger Admin</h1>
  <div class="tabs" id="tabs">

    <button data-t="plate">Plate builder</button>
    <button data-t="menu">Menu items</button>
    <button data-t="special">Today’s special</button>
  </div>
</header>
<main id="view"></main>
<input type="file" id="file" accept="image/png,image/jpeg,image/webp" hidden>
<input type="file" id="afile" accept="image/png,image/jpeg,image/webp" hidden>
<div id="busy" role="alert" aria-live="assertive"><div class="spin"></div><div id="busym">Uploading…</div><div style="font-size:14px;font-weight:500;opacity:.8">Please keep this page open</div></div>

<script>
(function () {
  var URL_ = 'https://fubhpawdzzjutsfzyzhz.supabase.co', KEY = 'sb_publishable_YCZHLx7xjXJtnwoJ7amhZg_NiHiJ0mm', BUCKET = 'food-menu';
  var CATS = [
    ['rice-spaghetti-noodles', 'Rice, Spaghetti & Noodles', 'Food'], ['swallow-soups', 'Swallow & Soups', 'Food'],

    showAddPic();
    fruitUI().then(loadItems);
  }
  /* Fruit shown on the Fresh Juices page. Saved in menu_items.fruit (needs the one-time SQL below). */
  var FRUITS = [['', 'Auto (from the name)'], ['orange', 'Orange'], ['apple', 'Apple'], ['kiwi', 'Kiwi'], ['pineapple', 'Pineapple'], ['watermelon', 'Watermelon'], ['none', 'No fruit']];

    var o = { category_id: menuCat, category_name: catLabel(), name: name, price: price, description: desc || null, details: det || null, available: true };
    return o;
  }
  function rowBody(row, n, p) {
    var o = { name: n, price: p, description: row.querySelector('.d').value.trim() || null, details: row.querySelector('.x').value.trim() || null, available: row.querySelector('.av').checked };
    return o;
  }
  var addFile = null, addPrev = '';
  function showAddPic() {
    var b = document.getElementById('apick'), c = document.getElementById('aclear'); if (!b) return;
    b.innerHTML = addPrev ? '<img src="' + addPrev + '" alt="">' : '+ Picture';
    if (c) c.hidden = !addFile;
  }
  function resetAdd() {
    if (addPrev) URL.revokeObjectURL(addPrev);
    addFile = null; addPrev = ''; showAddPic();
    ['an', 'ap', 'ad', 'ax', 'af'].forEach(function (i) { var e = document.getElementById(i); if (e) e.value = ''; });
  }
  function addItem() {
    var name = document.getElementById('an').value.trim(), price = parseFloat(document.getElementById('ap').value), desc = document.getElementById('ad').value.trim(), det = document.getElementById('ax').value.trim(), file = addFile, made = false, btn = document.getElementById('aadd');
    if (!name || isNaN(price)) return toast('Enter a name and a price', true);
    var cut = wantCut('items'), af = document.getElementById('af'), fval = af ? af.value : undefined; btn.disabled = true;
    busy(file ? 'Preparing picture…' : 'Saving item…');
    (file ? prepared(file, 1200, cut, cut) : Promise.resolve(null)).then(function (p) {
      busy('Saving item…');
      return rest('menu_items', { method: 'POST', headers: { Prefer: 'return=representation' }, body: [newItemBody(name, price, desc, det)] }).then(function (rows) { made = true; return setFruit(rows[0].id, fval).then(function () { return { p: p, id: rows[0].id }; }); });
    }).then(function (o) {
      if (!o.p) return;
      busy('Uploading picture…');
      return putPrepared('items/' + o.id, o.p).then(function (url) { return rest('menu_items?id=eq.' + o.id, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: { image_url: url } }); });
    }).then(function () { busy(); btn.disabled = false; toast('Item added'); resetAdd(); loadItems(); })
      .catch(function (e) { busy(); btn.disabled = false; if (made) { toast('Item saved, but this failed: ' + e.message + ' Open the item and try again.', true); resetAdd(); loadItems(); } else toast(e.message, true); });
  }
  function loadItems() {
    var box = document.getElementById('mlist');
    Promise.all([rest('menu_items?select=*&category_id=eq.' + encodeURIComponent(menuCat) + '&order=created_at.asc'),
      isJuice() ? rest('menu_images?select=key,image_url&key=like.fruit/items/*').catch(function () { return []; }) : Promise.resolve([])]).then(function (res) {
      var rows = res[0], fm = {}; res[1].forEach(function (m) { fm[m.key.split('/')[2]] = m.image_url; });
      if (!box) return;
      box.className = 'card';
      box.innerHTML = rows.length ? rows.map(function (r) {
        return '<div class="row" data-id="' + r.id + '" data-img="' + esc(r.image_url || '') + '"><div class="thm">' + (r.image_url ? '<img src="' + esc(r.image_url) + '" alt="">' : 'No pic') + '</div>' +
          '<input class="in n" value="' + esc(r.name) + '"><input class="in p" inputmode="decimal" value="' + Number(r.price).toFixed(2) + '">' +
          '<input class="in d" placeholder="Short description, e.g. Rice, chicken, plantain" value="' + esc(r.description || '') + '">' +
          '<textarea class="in x" rows="3" placeholder="Details shown on the product page, e.g. ingredients, size, what is inside">' + esc(r.details || '') + '</textarea>' +
          (isJuice() ? '<div class="frw"><span>Fruit on the page</span>' + fruitSelect('fr', fm[r.id]) + '</div>' : '') +
          '<label class="chk sm" style="margin:0"><input type="checkbox" class="av"' + (r.available === false ? '' : ' checked') + '> Available</label>' +
          (isDrinkCat() && r.image_url ? '<button class="b ghost" data-m3d>Make 3D</button><span class="muted" data-mst></span>' : '') + '<button class="b" data-save>Save</button><button class="b ghost" data-ipic>' + (r.image_url ? 'Replace pic' : 'Add pic') + '</button>' +
          (r.image_url ? '<button class="b ghost" data-ipicrm>Clear pic</button>' : '') + '<button class="b ghost" data-del>Delete</button></div>';
      }).join('') : '<span class="muted">No items in this category yet.</span>';
      if (isDrinkCat()) rest('menu_images?select=key,image_url&key=like.models/items/*').then(function (ms) {
        ms.forEach(function (m) {
          var id = m.key.split('/')[2], row = box.querySelector('.row[data-id="' + id + '"]'); if (!row) return;
          var st = row.querySelector('[data-mst]'), bt = row.querySelector('[data-m3d]'); if (st) st.textContent = '3D ready'; if (bt) bt.textContent = 'Redo 3D';
          if (!row.querySelector('[data-m3drm]') && bt) { var rm = document.createElement('button'); rm.className = 'b ghost'; rm.setAttribute('data-m3drm', ''); rm.textContent = 'Remove 3D'; bt.parentNode.insertBefore(rm, bt.nextSibling); }
        });
      }).catch(function () {});
    }).catch(function (e) { if (box) { box.className = 'card muted'; box.textContent = 'Could not load: ' + e.message; } });
  }
  function isDrinkCat() { for (var i = 0; i < MENU_CATS.length; i++) if (MENU_CATS[i][0] === menuCat) return MENU_CATS[i][2] === 'Drinks'; return false; }
  /* picture -> 3D model through /api/tripo; polls until Tripo is done (about a minute or two) */
  function make3d(row) {
    var id = row.getAttribute('data-id'), img = row.getAttribute('data-img'); if (!img) return toast('Add a picture first', true);
    busy('Starting 3D…');
    fetch('../api/tripo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ image_url: img.split('?')[0] }) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Could not start 3D'); return j.task_id; }); })
      .then(function (task) {
        var t0 = Date.now();
        function poll() {
          return fetch('../api/tripo?id=' + encodeURIComponent(task) + '&item=' + encodeURIComponent(id)).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || '3D failed'); return j; }); })
            .then(function (j) {
              if (j.status === 'success') return j;
              if (j.status === 'failed') throw new Error('Tripo could not make a 3D model from that picture');
              if (Date.now() - t0 > 300000) throw new Error('3D is taking too long. Try again in a minute.');
              busy('Making 3D… ' + (j.progress || 0) + '%');
              return new Promise(function (ok) { setTimeout(ok, 3000); }).then(poll);
            });
        }
        return poll();
      }).then(function () { busy(); toast('3D model ready'); loadItems(); })
      .catch(function (e) { busy(); toast(e.message, true); });
  }
  function catLabel() { for (var i = 0; i < MENU_CATS.length; i++) if (MENU_CATS[i][0] === menuCat) return MENU_CATS[i][1]; return menuCat; }
  function addRows(list) {
    var rows = list.map(function (x) { return { category_id: menuCat, category_name: catLabel(), name: x.n, price: x.p }; });
    if (!rows.length) { toast('Nothing to add', true); return Promise.resolve(); }
    return rest('menu_items', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: rows }).then(function () { toast(rows.length + ' added'); loadItems(); });
  }

  /* ---- Today's special ---- */
  function special() {
    view.innerHTML = '<h2>Today’s special</h2><div class="card muted" id="sp">Loading…</div>';
    rest('today_special?select=title,total_price,active&order=created_at.desc&limit=1').then(function (r) {
      var s = r[0] || {}, box = document.getElementById('sp'); if (!box) return;
      box.className = 'card';
      box.innerHTML = '<p class="muted" style="margin:0 0 8px">' + (s.active ? 'Showing now: <b>' + esc(s.title) + '</b> ' + usd(s.total_price) : 'No special is showing, so the app uses its default.') + '</p>' +
        '<input class="in" id="st" placeholder="Name, e.g. Double Double" value="' + esc(s.active ? s.title : '') + '" style="margin-bottom:8px">' +
        '<input class="in" id="spr" inputmode="decimal" placeholder="Price" value="' + (s.active ? Number(s.total_price).toFixed(2) : '') + '">' +
        '<div class="btns" style="margin-top:10px"><button class="b" id="spub">Publish</button><button class="b ghost" id="soff">Turn off</button></div>';
    }).catch(function (e) { var b = document.getElementById('sp'); if (b) b.textContent = 'Could not load: ' + e.message; });
  }

  function show(t) {
    tab = t;
    [].forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.classList.toggle('on', b.getAttribute('data-t') === t); });
    (t === 'pics' ? pics : t === 'plate' ? plate : t === 'menu' ? menu : special)();
  }

  document.getElementById('tabs').addEventListener('click', function (e) { var t = e.target.getAttribute && e.target.getAttribute('data-t'); if (t) show(t); });
  document.getElementById('afile').addEventListener('change', function () {
    var f = this.files[0]; this.value = ''; if (!f) return;
    if (addPrev) URL.revokeObjectURL(addPrev);
    addFile = f; addPrev = URL.createObjectURL(f); showAddPic();
  });
  fileEl.addEventListener('change', function () {
    var f = fileEl.files[0], key = pending; fileEl.value = ''; if (!f || !key) return;
    busy('Preparing picture…');
    (key.indexOf('item:') === 0 ? uploadItem(key.slice(5), f) : upload(key, f)).then(function (url) { busy(); toast('Saved'); if (key.indexOf('item:') === 0) rowPic(view.querySelector('.row[data-id="' + key.slice(5) + '"]'), url); else if (tab === 'pics') pics(); else if (tab === 'plate') plate(); }).catch(function (e) { busy(); toast(e.message, true); });
  });
  view.addEventListener('change', function (e) {
    var ck = e.target.getAttribute && e.target.getAttribute('data-cut');
    if (ck) { cutPref[ck] = e.target.checked; return; }
    if (e.target.id === 'mcat') { menuCat = e.target.value; fruitUI().then(loadItems); }
  });
  view.addEventListener('click', function (e) {
    var t = e.target; if (!t.closest) return; var b = t.closest('button'); if (!b) return;
    var irow = b.closest('.row'), iid = irow && irow.getAttribute('data-id');
    if (b.hasAttribute('data-ipic') && iid) { pending = 'item:' + iid; fileEl.click(); return; }
    if (b.hasAttribute('data-ipicrm') && iid) { b.disabled = true; clearItem(iid, irow.getAttribute('data-img')).then(function () { toast('Cleared'); rowPic(irow, ''); }).catch(function (x) { toast(x.message, true); b.disabled = false; }); return; }
    var up = b.getAttribute('data-up'), rm = b.getAttribute('data-rm');
    if (up) { pending = up; fileEl.click(); return; }
    if (rm) { if (confirm('Remove this picture?')) { b.disabled = true; removeImg(rm).then(function () { toast('Removed'); show(tab); }).catch(function (x) { toast(x.message, true); b.disabled = false; }); } return; }
    if (b.hasAttribute('data-m3d') && iid) { make3d(irow); return; }
    if (b.hasAttribute('data-m3drm') && iid) { if (confirm('Remove the 3D model for this drink?')) rest('menu_images?key=eq.models/items/' + iid, { method: 'DELETE' }).then(function () { toast('3D removed'); loadItems(); }).catch(function (x) { toast(x.message, true); }); return; }
    var row = b.closest('.row'), id = row && row.getAttribute('data-id');
    if (b.hasAttribute('data-save') && id) {
      var n = row.querySelector('.n').value.trim(), p = parseFloat(row.querySelector('.p').value);
      if (!n || isNaN(p)) return toast('Enter a name and a price', true);
      rest('menu_items?id=eq.' + id, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: rowBody(row, n, p) }).then(function () { var fs = row.querySelector('.fr'); return setFruit(id, fs ? fs.value : undefined); }).then(function () { toast('Saved'); }).catch(function (x) { toast(x.message, true); });
    } else if (b.hasAttribute('data-del') && id) {
      if (confirm('Delete this item?')) rest('menu_items?id=eq.' + id, { method: 'DELETE' }).then(function () { if (isJuice()) rest('menu_images?key=eq.' + encodeURIComponent('fruit/items/' + id), { method: 'DELETE' }).catch(function () {}); toast('Deleted'); loadItems(); }).catch(function (x) { toast(x.message, true); });
    } else if (b.id === 'aadd') {
      addItem();
    } else if (b.id === 'apick') {
      document.getElementById('afile').click();
    } else if (b.id === 'aclear') {
      if (addPrev) URL.revokeObjectURL(addPrev);
      addFile = null; addPrev = ''; showAddPic();
    } else if (b.id === 'abulk') {
      var list = [], bad = 0;
      document.getElementById('bulk').value.split('\n').forEach(function (l) {
        l = l.trim(); if (!l) return;
        var m = l.match(/^(.+?)\s*[|,;]\s*\$?([\d.]+)\s*$/) || l.match(/^(.+?)\s+\$?([\d.]+)\s*$/);
        if (m && !isNaN(parseFloat(m[2]))) list.push({ n: m[1].trim(), p: parseFloat(m[2]) }); else bad++;
      });
      if (bad) return toast(bad + ' line(s) have no price. Fix them and try again.', true);
      addRows(list).then(function () { document.getElementById('bulk').value = ''; }).catch(function (x) { toast(x.message, true); });
    } else if (b.id === 'spub') {
      var st = document.getElementById('st').value.trim(), sp = parseFloat(document.getElementById('spr').value);
      if (!st || isNaN(sp)) return toast('Enter a name and a price', true);
      rest('today_special?active=eq.true', { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: { active: false } })
        .then(function () { return rest('today_special', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: { title: st, total_price: sp, active: true } }); })
        .then(function () { toast('Published'); special(); }).catch(function (x) { toast(x.message, true); });
    } else if (b.id === 'soff') {
      rest('today_special?active=eq.true', { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: { active: false } }).then(function () { toast('Turned off'); special(); }).catch(function (x) { toast(x.message, true); });
    }
  });

  rest('menu_images?select=key,image_url').then(function (r) { r.forEach(function (x) { imgs[x.key] = x.image_url; }); }).catch(function () { toast('Could not reach Supabase', true); }).then(function () { show('pics'); });
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(function () {}); });
})();
</script>
</body>
</html>
