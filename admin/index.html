<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D1B19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Burger Admin</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600;700&display=swap">
<style>
:root{--rust:#C34725;--ink:#1D1B19;--cream:#FFFCF7;--line:#EFE6DA;--mut:#6F665E;--ok:#2E8B57}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font-family:'Saira Semi Condensed',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom,0px)}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#FFF3DB;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0}
header h1{margin:0 0 10px;font-size:22px;letter-spacing:.3px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;border:0;background:none;color:#cdbfa8;font:600 15px inherit;font-family:inherit;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:#fff;border-color:var(--rust)}
main{max-width:980px;margin:0 auto;padding:16px}
h2{font-size:20px;margin:22px 0 10px}
.note{background:#FFF1E6;border:1px solid #F3D3B8;color:#7a3b17;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.cat h3{margin:0 0 10px;font-size:16px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.th{height:92px;border-radius:10px;background:conic-gradient(#f3ece2 25%,#fff 0 50%,#f3ece2 0 75%,#fff 0) 0 0/14px 14px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--mut);font-size:12px}
.th img{max-width:100%;max-height:100%;object-fit:contain}
.sl{font-size:12px;font-weight:600;color:var(--mut);margin:6px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.b{border:0;border-radius:9px;background:var(--rust);color:#fff;font:600 14px inherit;font-family:inherit;padding:9px 12px;min-height:38px;cursor:pointer}
.b.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.b:disabled{opacity:.55;cursor:default}
.in,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-size:16px;padding:10px 12px;min-height:44px}
textarea{min-height:110px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 110px auto auto;gap:8px;align-items:center;margin-bottom:8px}
.add{display:grid;grid-template-columns:1fr 110px auto;gap:8px;margin:8px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
label.chk{display:flex;gap:8px;align-items:center;margin:10px 0;font-weight:600}
.muted{color:var(--mut);font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:15px;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.show{opacity:1}
#toast.err{background:#a8281a}
@media (max-width:560px){.row{grid-template-columns:1fr 90px}.row .b{grid-column:span 1}}
</style>
</head>
<body>
<header>
  <h1>Burger Admin</h1>
  <div class="tabs" id="tabs">
    <button data-t="pics" class="on">Pictures</button>
    <button data-t="menu">Menu items</button>
    <button data-t="special">Today’s special</button>
  </div>
</header>
<main id="view"></main>
<input type="file" id="file" accept="image/png,image/jpeg,image/webp" hidden>
<div id="toast" role="status"></div>

<script>
(function () {
  var URL_ = 'https://fubhpawdzzjutsfzyzhz.supabase.co', KEY = 'sb_publishable_YCZHLx7xjXJtnwoJ7amhZg_NiHiJ0mm', BUCKET = 'food-menu';
  var CATS = [
    ['rice-spaghetti-noodles', 'Rice, Spaghetti & Noodles', 'Food'], ['swallow-soups', 'Swallow & Soups', 'Food'],
    ['beans-plantain', 'Beans & Plantain', 'Food'], ['yam-potato', 'Yam & Potato Dishes', 'Food'],
    ['chicken-turkey', 'Chicken & Turkey', 'Food'], ['beef-fish-seafood', 'Beef, Fish & Seafood', 'Food'],
    ['grills-bbq', 'Grills & BBQ', 'Food'], ['burgers-sandwiches-shawarma', 'Burgers, Sandwiches & Shawarma', 'Food'],
    ['pizza', 'Pizza', 'Food'], ['small-chops-snacks', 'Small Chops & Snacks', 'Food'],
    ['breakfast-specials', 'Breakfast & Specials', 'Food'], ['salads-sides', 'Salads & Sides', 'Food'],
    ['soft-drinks-sodas', 'Soft Drinks & Sodas', 'Drinks'], ['fresh-juices', 'Fresh Juices', 'Drinks'],
    ['smoothies-milkshakes', 'Smoothies & Milkshakes', 'Drinks'], ['water', 'Water', 'Drinks']
  ];
  var view = document.getElementById('view'), fileEl = document.getElementById('file'), toastEl = document.getElementById('toast');
  var imgs = {}, tab = 'pics', menuCat = CATS[0][0], pending = null, tt = 0;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function toast(m, bad) { toastEl.textContent = m; toastEl.className = 'show' + (bad ? ' err' : ''); clearTimeout(tt); tt = setTimeout(function () { toastEl.className = ''; }, 3200); }
  function rest(path, o) {
    o = o || {};
    var h = { apikey: KEY, Authorization: 'Bearer ' + KEY }, k;
    for (k in (o.headers || {})) h[k] = o.headers[k];
    if (o.body) h['Content-Type'] = 'application/json';
    return fetch(URL_ + '/rest/v1/' + path, { method: o.method || 'GET', headers: h, body: o.body ? JSON.stringify(o.body) : undefined })
      .then(function (r) {
        if (!r.ok) return r.text().then(function (t) { throw new Error(t || r.status); });
        return r.text().then(function (t) { return t ? JSON.parse(t) : null; });
      });
  }
  function pubUrl(path) { return URL_ + '/storage/v1/object/public/' + BUCKET + '/' + path; }
  function pathFromUrl(u) { var i = u.indexOf('/' + BUCKET + '/'); return i < 0 ? null : u.slice(i + BUCKET.length + 2).split('?')[0]; }

  /* ---- image processing: shrink + keep transparency for PNG/WebP ---- */
  function prep(file, max) {
    return new Promise(function (res, rej) {
      var u = URL.createObjectURL(file), im = new Image();
      im.onload = function () {
        var s = Math.min(1, max / Math.max(im.width, im.height)), w = Math.round(im.width * s), h = Math.round(im.height * s),
            c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(im, 0, 0, w, h); URL.revokeObjectURL(u);
        var png = file.type !== 'image/jpeg', type = png ? 'image/png' : 'image/jpeg', ext = png ? 'png' : 'jpg';
        c.toBlob(function (b) {
          if (!b) return rej(new Error('Could not process that image'));
          if (b.size <= 5242880) return res({ blob: b, type: type, ext: ext });
          c.toBlob(function (b2) {
            if (b2 && b2.type === 'image/webp' && b2.size <= 5242880) res({ blob: b2, type: 'image/webp', ext: 'webp' });
            else rej(new Error('Image is over 5 MB even after shrinking. Try a smaller one.'));
          }, 'image/webp', .85);
        }, type, .9);
      };
      im.onerror = function () { URL.revokeObjectURL(u); rej(new Error('That file is not a valid image')); };
      im.src = u;
    });
  }
  function upload(key, file) {
    var max = key.indexOf('icons/') === 0 ? 600 : 1600;
    return prep(file, max).then(function (p) {
      var path = key + '.' + p.ext;
      return fetch(URL_ + '/storage/v1/object/' + BUCKET + '/' + path, {
        method: 'POST',
        headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': p.type, 'x-upsert': 'true', 'cache-control': 'max-age=3600' },
        body: p.blob
      }).then(function (r) {
        if (!r.ok) return r.text().then(function (t) { throw new Error(t || r.status); });
        var url = pubUrl(path) + '?v=' + Date.now();
        return rest('menu_images?on_conflict=key', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
          body: [{ key: key, image_url: url, updated_at: new Date().toISOString() }] }).then(function () { imgs[key] = url; });
      });
    });
  }
  function removeImg(key) {
    var path = imgs[key] && pathFromUrl(imgs[key]);
    return rest('menu_images?key=eq.' + encodeURIComponent(key), { method: 'DELETE' }).then(function () {
      delete imgs[key];
      if (path) return fetch(URL_ + '/storage/v1/object/' + BUCKET + '/' + path, { method: 'DELETE', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY } }).catch(function () {});
    });
  }

  /* ---- Pictures ---- */
  function slot(key, label) {
    var u = imgs[key];
    return '<div><div class="th">' + (u ? '<img src="' + esc(u) + '" alt="">' : '<span>No image</span>') + '</div>' +
      '<div class="sl">' + label + '</div><div class="btns"><button class="b" data-up="' + key + '">' + (u ? 'Replace' : 'Upload') + '</button>' +
      (u ? '<button class="b ghost" data-rm="' + key + '">Remove</button>' : '') + '</div></div>';
  }
  function pics() {
    var h = '<div class="note">No login yet: anyone with this page’s link can change pictures. Keep the link private until auth is added.</div>';
    ['Food', 'Drinks'].forEach(function (g) {
      h += '<h2>' + g + ' categories</h2><div class="grid">';
      CATS.filter(function (c) { return c[2] === g; }).forEach(function (c) {
        h += '<div class="cat"><h3>' + esc(c[1]) + '</h3><div class="slots">' + slot('posters/' + c[0], 'Poster') + slot('icons/' + c[0], 'Carousel icon') + '</div></div>';
      });
      h += '</div>';
    });
    h += '<h2>App pictures</h2><div class="grid"><div class="cat"><h3>Home</h3><div class="slots">' + slot('static/burger', 'Featured burger') + slot('static/hero', 'Drawer banner') + '</div></div></div>';
    view.innerHTML = h;
  }

  /* ---- Menu items ---- */
  function usd(n) { return '$' + (Number(n) || 0).toFixed(2); }
  function menu() {
    var opts = CATS.map(function (c) { return '<option value="' + c[0] + '"' + (c[0] === menuCat ? ' selected' : '') + '>' + esc(c[1]) + '</option>'; }).join('');
    view.innerHTML = '<h2>Menu items</h2><select id="mcat">' + opts + '</select><div id="mlist" class="card muted">Loading…</div>' +
      '<div class="card"><b>Add one</b><div class="add"><input class="in" id="an" placeholder="Item name"><input class="in" id="ap" inputmode="decimal" placeholder="Price"><button class="b" id="aadd">Add</button></div></div>' +
      '<div class="card"><b>Paste many</b><p class="muted" style="margin:6px 0">One per line, like <i>Jollof Rice | 12.99</i></p><textarea id="bulk" placeholder="Jollof Rice | 12.99&#10;Fried Rice | 13.50"></textarea><div style="margin-top:8px"><button class="b" id="abulk">Add all</button></div></div>';
    loadItems();
  }
  function loadItems() {
    var box = document.getElementById('mlist');
    rest('menu_items?select=id,name,price&category_id=eq.' + encodeURIComponent(menuCat) + '&order=created_at.asc').then(function (rows) {
      if (!box) return;
      box.className = 'card';
      box.innerHTML = rows.length ? rows.map(function (r) {
        return '<div class="row" data-id="' + r.id + '"><input class="in n" value="' + esc(r.name) + '"><input class="in p" inputmode="decimal" value="' + Number(r.price).toFixed(2) + '"><button class="b" data-save>Save</button><button class="b ghost" data-del>Delete</button></div>';
      }).join('') : '<span class="muted">No items in this category yet.</span>';
    }).catch(function (e) { if (box) { box.className = 'card muted'; box.textContent = 'Could not load: ' + e.message; } });
  }
  function catLabel() { for (var i = 0; i < CATS.length; i++) if (CATS[i][0] === menuCat) return CATS[i][1]; return menuCat; }
  function addRows(list) {
    var rows = list.map(function (x) { return { category_id: menuCat, category_name: catLabel(), name: x.n, price: x.p }; });
    if (!rows.length) { toast('Nothing to add', true); return Promise.resolve(); }
    return rest('menu_items', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: rows }).then(function () { toast(rows.length + ' added'); loadItems(); });
  }

  /* ---- Today's special ---- */
  function special() {
    view.innerHTML = '<h2>Today’s special</h2><div class="card muted" id="sp">Loading…</div>';
    rest('today_special?select=title,total_price,active&order=created_at.desc&limit=1').then(function (r) {
      var s = r[0] || {}, box = document.getElementById('sp'); if (!box) return;
      box.className = 'card';
      box.innerHTML = '<p class="muted" style="margin:0 0 8px">' + (s.active ? 'Showing now: <b>' + esc(s.title) + '</b> ' + usd(s.total_price) : 'No special is showing, so the app uses its default.') + '</p>' +
        '<input class="in" id="st" placeholder="Name, e.g. Double Double" value="' + esc(s.active ? s.title : '') + '" style="margin-bottom:8px">' +
        '<input class="in" id="spr" inputmode="decimal" placeholder="Price" value="' + (s.active ? Number(s.total_price).toFixed(2) : '') + '">' +
        '<div class="btns" style="margin-top:10px"><button class="b" id="spub">Publish</button><button class="b ghost" id="soff">Turn off</button></div>';
    }).catch(function (e) { var b = document.getElementById('sp'); if (b) b.textContent = 'Could not load: ' + e.message; });
  }

  function show(t) {
    tab = t;
    [].forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.classList.toggle('on', b.getAttribute('data-t') === t); });
    (t === 'pics' ? pics : t === 'menu' ? menu : special)();
  }

  document.getElementById('tabs').addEventListener('click', function (e) { var t = e.target.getAttribute && e.target.getAttribute('data-t'); if (t) show(t); });
  fileEl.addEventListener('change', function () {
    var f = fileEl.files[0], key = pending; fileEl.value = ''; if (!f || !key) return;
    toast('Uploading…');
    upload(key, f).then(function () { toast('Saved'); if (tab === 'pics') pics(); }).catch(function (e) { toast(e.message, true); });
  });
  view.addEventListener('change', function (e) { if (e.target.id === 'mcat') { menuCat = e.target.value; loadItems(); } });
  view.addEventListener('click', function (e) {
    var t = e.target; if (!t.closest) return; var b = t.closest('button'); if (!b) return;
    var up = b.getAttribute('data-up'), rm = b.getAttribute('data-rm');
    if (up) { pending = up; fileEl.click(); return; }
    if (rm) { if (confirm('Remove this picture?')) { b.disabled = true; removeImg(rm).then(function () { toast('Removed'); pics(); }).catch(function (x) { toast(x.message, true); b.disabled = false; }); } return; }
    var row = b.closest('.row'), id = row && row.getAttribute('data-id');
    if (b.hasAttribute('data-save') && id) {
      var n = row.querySelector('.n').value.trim(), p = parseFloat(row.querySelector('.p').value);
      if (!n || isNaN(p)) return toast('Enter a name and a price', true);
      rest('menu_items?id=eq.' + id, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: { name: n, price: p } }).then(function () { toast('Saved'); }).catch(function (x) { toast(x.message, true); });
    } else if (b.hasAttribute('data-del') && id) {
      if (confirm('Delete this item?')) rest('menu_items?id=eq.' + id, { method: 'DELETE' }).then(function () { toast('Deleted'); loadItems(); }).catch(function (x) { toast(x.message, true); });
    } else if (b.id === 'aadd') {
      var an = document.getElementById('an').value.trim(), ap = parseFloat(document.getElementById('ap').value);
      if (!an || isNaN(ap)) return toast('Enter a name and a price', true);
      addRows([{ n: an, p: ap }]).then(function () { document.getElementById('an').value = ''; document.getElementById('ap').value = ''; }).catch(function (x) { toast(x.message, true); });
    } else if (b.id === 'abulk') {
      var list = [], bad = 0;
      document.getElementById('bulk').value.split('\n').forEach(function (l) {
        l = l.trim(); if (!l) return;
        var m = l.match(/^(.+?)\s*[|,;]\s*\$?([\d.]+)\s*$/) || l.match(/^(.+?)\s+\$?([\d.]+)\s*$/);
        if (m && !isNaN(parseFloat(m[2]))) list.push({ n: m[1].trim(), p: parseFloat(m[2]) }); else bad++;
      });
      if (bad) return toast(bad + ' line(s) have no price. Fix them and try again.', true);
      addRows(list).then(function () { document.getElementById('bulk').value = ''; }).catch(function (x) { toast(x.message, true); });
    } else if (b.id === 'spub') {
      var st = document.getElementById('st').value.trim(), sp = parseFloat(document.getElementById('spr').value);
      if (!st || isNaN(sp)) return toast('Enter a name and a price', true);
      rest('today_special?active=eq.true', { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: { active: false } })
        .then(function () { return rest('today_special', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: { title: st, total_price: sp, active: true } }); })
        .then(function () { toast('Published'); special(); }).catch(function (x) { toast(x.message, true); });
    } else if (b.id === 'soff') {
      rest('today_special?active=eq.true', { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: { active: false } }).then(function () { toast('Turned off'); special(); }).catch(function (x) { toast(x.message, true); });
    }
  });

  rest('menu_images?select=key,image_url').then(function (r) { r.forEach(function (x) { imgs[x.key] = x.image_url; }); }).catch(function () { toast('Could not reach Supabase', true); }).then(function () { show('pics'); });
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(function () {}); });
})();
</script>
</body>
</html>
