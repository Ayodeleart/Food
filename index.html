.cic{position:absolute;left:0;top:0;width:60px;height:60px;border-radius:30px;background:rgba(255,255,255,.07);color:#9a9ed6;display:flex;align-items:center;justify-content:center;will-change:transform,opacity}
.nt .cic{transition:none}
.cic.on{background:rgba(255,255,255,.13);color:#f1d489}
.cic svg{width:56%;height:56%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 18px;padding:26px 22px 40px}
.dcard{background:#fff;color:#1c2a25;border-radius:32px;padding:10px 8px 16px;text-align:center;box-shadow:0 10px 16px -6px rgba(120,80,0,.28);display:flex;flex-direction:column;align-items:center}
.dcard img{width:100%;height:110px;object-fit:contain}
.cic img{width:70%;height:70%;object-fit:contain;pointer-events:none}
.catpage{position:absolute;top:0;left:0;right:0;bottom:0;z-index:40;background:#e8ebea;will-change:clip-path}
.catpage iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.subback{position:absolute;right:8px;top:calc(env(safe-area-inset-top,0px) + 12px);width:44px;height:44px;border-radius:22px;background:rgba(20,12,8,.5);color:#FFF3DB;display:flex;align-items:center;justify-content:center;z-index:2}
.gtitle{padding:22px 40px 10px;font-size:26px;font-weight:700;color:#2A211B;letter-spacing:.5px;text-transform:uppercase}
.dcard b{margin-top:8px;font-size:18px}
.dcard small{font-size:12px;font-weight:600;opacity:.7}
@media (prefers-reduced-motion: reduce){.drawer{animation:none}.cic{transition:none}}

.dlight{background:#FFFCF7}
.banner .dclose{color:#FFF3DB}
.mscroll{background:#161d1b}
.mhead{position:relative;height:100px}
.mhero{margin:0 16px;height:360px;border-radius:40px;background:#f6cd5c;color:#1c2a25;position:relative;overflow:hidden;text-align:center}
.mhero small{display:block;margin-top:24px;font-size:16px;font-weight:600}
.mhero h2{margin:6px 24px 0;font-size:60px;line-height:.9;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.mhero img{position:absolute;left:50%;bottom:70px;height:150px;width:auto;max-width:80%;transform:translateX(-50%);object-fit:contain}
.mpill{position:absolute;left:14px;right:14px;bottom:14px;height:52px;display:flex;gap:8px}
.mpill .info{flex:1;border-radius:26px;background:rgba(28,42,37,.45);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 20px;font-size:15px;font-weight:600;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.mpill button{width:62px;border-radius:26px;background:rgba(28,42,37,.55);color:#fff;font-size:28px;font-weight:600}
.mcats{background:#EDE6D8;margin-top:10px;padding-bottom:140px;min-height:calc(100% - 110px);box-sizing:border-box}
.mcats .dtop{height:175px;border-radius:0;overflow:visible;background:#1e2250;position:sticky;top:0;z-index:4}
.mcats .dtitle{top:30px}.arcsvg{position:absolute;left:0;top:0;pointer-events:none}
.mcats .dgrid{padding-top:30px}
</style>

    var h = (standalone && window.innerHeight > window.innerWidth) ? Math.max(screen.width, screen.height) + 'px' : '';
    document.documentElement.style.height = h; document.body.style.height = h;
  }
  fit(); window.addEventListener('resize', fit); window.addEventListener('orientationchange', fit);
})();

  }
  function carShape() {
    var el = document.getElementById('car'), sv = document.getElementById('arcsvg'); if (!el || !sv) return;
    var W = el.clientWidth, H = el.clientHeight, a = W / 2, c1 = 78, s1 = Math.round(W * 0.19), s2 = Math.round(W * 0.27);

    el.style.clipPath = 'path("M0 0H' + W + 'V' + y2 + 'A' + R2 + ' ' + R2 + ' 0 0 1 0 ' + y2 + 'Z")';
    sv.setAttribute('width', W); sv.setAttribute('height', H);
    sv.innerHTML = '<path d="M0 0H' + W + 'V' + y1 + 'A' + R1 + ' ' + R1 + ' 0 0 1 0 ' + y1 + 'Z" fill="#12153a"/>' +
      '<path d="M' + W + ' ' + y1 + 'A' + R1 + ' ' + R1 + ' 0 0 1 0 ' + y1 + '" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="1.5"/>' +
      '<path d="M' + (a - 11) + ' ' + c1 + 'L' + a + ' ' + (c1 - 10) + 'L' + (a + 11) + ' ' + c1 + 'Z" fill="#1e2250"/>';

  function openDrawer() {

  /* Categories that open their own page (circular reveal from the tap) */
  var PAGES = {

  var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var EASE = 'cubic-bezier(.22,.8,.2,1)';
  var origin = { x: 0, y: 0 };

    openPage(PAGES[k] + '?cat=' + k + '&t=' + encodeURIComponent(CATS[k].label), CATS[k].bg, ev, CATS[k].label, /product-carousel/.test(PAGES[k]) ? function () { return true; } : undefined);
  }
  function satPx() {   // status-bar / notch height, measured here because iframes can't always see env()

    document.body.appendChild(p); var v = parseFloat(getComputedStyle(p).paddingTop) || 0; p.remove();

  }
  function openPage(src, bg, ev, label, wire) {
    if (document.getElementById('catpage')) return;
    var box = app.getBoundingClientRect();
    origin.x = ev && ev.clientX != null ? ev.clientX - box.left : box.width / 2;
    origin.y = ev && ev.clientY != null ? ev.clientY - box.top : box.height / 2;
    var far = Math.hypot(Math.max(origin.x, box.width - origin.x), Math.max(origin.y, box.height - origin.y)) + 4;
    app.insertAdjacentHTML('beforeend', '<div class="catpage" id="catpage" style="background:' + bg + ';clip-path:' + circleAt(0) + '">' +
      '<iframe src="' + src + '" title="' + esc(label) + '" style="opacity:0"></iframe>' +
      '<button class="subback" data-closesub="1" aria-label="Close" style="opacity:0">' + ICON2.close + '</button></div>');
    var pg = document.getElementById('catpage'), fr = pg.querySelector('iframe'), bk = pg.querySelector('.subback');
    var t0 = performance.now(), loaded = false, shown = false;
    function reveal() {
      if (shown || !loaded || performance.now() - t0 < 300) return;

      if (REDUCED) { fr.style.opacity = 1; bk.style.opacity = 1; return; }
      fr.animate([{ opacity: 0, transform: 'scale(.94) translateY(14px)' }, { opacity: 1, transform: 'none' }], { duration: 420, easing: EASE, fill: 'forwards' });
      bk.animate([{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'none' }], { duration: 320, delay: 160, easing: EASE, fill: 'forwards' });
    }

      try { fr.contentDocument.documentElement.style.setProperty('--sat', satPx() + 'px'); } catch (_) {}

  var SB_URL = 'https://fubhpawdzzjutsfzyzhz.supabase.co', SB_KEY = 'sb_publishable_YCZHLx7xjXJtnwoJ7amhZg_NiHiJ0mm';
