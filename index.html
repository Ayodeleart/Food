<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Burger App</title>
<meta name="description" content="Order food and drinks.">
<meta name="theme-color" content="#C34725">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Burger App">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600;700&display=swap">
<style>
:root{background:#C34725;padding-bottom:0!important}
[hidden]{display:none!important}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}body{position:relative}input{-webkit-user-select:text;user-select:text}.app,.scroll{overscroll-behavior:none;-webkit-touch-callout:none}
body{margin:0;background:#FFFCF7;color:#1D1B19;font-family:'Saira Semi Condensed',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;-webkit-text-size-adjust:100%}
.app{position:relative;height:100%;max-width:430px;margin:0 auto;overflow:hidden;background:#FFFCF7}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-appearance:none;appearance:none;padding:0;margin:0;border:0;background:transparent}
.scroll{position:absolute;left:0;top:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

.screen{animation:fade .25s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{height:187px}to{height:270px}}
@media (prefers-reduced-motion: reduce){.screen,.hero{animation:none!important}}

.banner{position:relative;height:368px;background:#C34725;overflow:hidden}
.banner img{position:absolute;left:0;bottom:0;width:100%;height:auto;display:block}
.hdr{position:absolute;left:8px;right:16px;top:44px;height:44px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.logo{position:absolute;left:0;right:0;top:44px;height:44px;display:flex;justify-content:center;align-items:center;pointer-events:none;z-index:1}
.iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#FFF3DB}
.iconbtn.back{border-radius:22px;background:rgba(20,12,8,.32)}
.cartbtn{min-height:44px;display:flex;align-items:center;color:#FFF3DB;font-size:15px;font-weight:600;letter-spacing:1.4px}
.cartbtn svg{margin-right:8px}
.cartbtn .cw{margin-left:8px}

.card{position:relative;display:flex;flex-direction:column;justify-content:center;width:100%;height:187px;overflow:hidden;box-sizing:border-box;text-align:left;color:#FFF3DB}
.card.r{align-items:flex-end;padding-right:39px}
.card.l{align-items:flex-start;padding-left:40px}
.card img{position:absolute;top:0;height:187px;width:auto;max-width:62%;object-fit:contain;display:block}
.card.r img{left:0;object-position:left center}
.card.l img{right:0;object-position:right center}
.card:active{filter:brightness(.94)}
.ctitle{position:relative;max-width:56%;font-size:26px;font-weight:700;line-height:1.05;letter-spacing:.4px}
.card.r .ctitle{text-align:right}
.pill{position:relative;display:flex;align-items:center;justify-content:center;width:54px;height:26px;margin-top:14px;border:2px solid #FFF3DB;border-radius:13px;box-sizing:border-box}

.hero{position:relative;height:270px;overflow:hidden;animation:grow .4s cubic-bezier(.2,.8,.2,1) both}
.himg{position:absolute;bottom:0;height:226px;width:auto;max-width:62%;object-fit:contain;display:block}
.hero.r .himg{left:0;object-position:left bottom}
.hero.l .himg{right:0;object-position:right bottom}
.htitle{position:absolute;top:116px;max-width:56%;font-size:30px;font-weight:700;line-height:1.05;letter-spacing:.4px;color:#FFF3DB}
.hero.r .htitle{text-align:right}
.hero.r .htitle{right:39px}
.hero.l .htitle{left:40px}

.tabs{display:flex;padding:14px 12px 4px}
.tab{min-height:44px;padding:0 16px;margin-right:6px;border-radius:6px;font-size:18px;font-weight:600;color:#3A332D}
.tab.on{background:#2A211B;color:#FFF3DB}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-gap:18px 12px;gap:18px 12px;padding:12px 16px 28px}
.tile{min-width:0;box-sizing:border-box;display:flex;flex-direction:column;background:#fff;border:1px solid #EFE6DA;border-radius:14px;padding:14px}
.trow{display:flex;align-items:flex-start;justify-content:space-between}
.name{min-width:0;font-size:18px;font-weight:700;line-height:1.15}
.sub{margin-top:4px;font-size:14px;font-weight:500;color:#6F665E}
.heart{flex:none;width:44px;height:44px;margin:-12px -12px 0 4px;display:flex;align-items:center;justify-content:center;color:#6F665E}
.heart.on{color:#C34725}
.prow{display:flex;align-items:baseline;flex-wrap:wrap;margin-top:12px}
.price{font-size:22px;font-weight:700}
.was{margin-left:8px;font-size:14px;font-weight:500;color:#6F665E;text-decoration:line-through}
.badge{margin-left:8px;padding:2px 7px;background:#2E8B57;color:#fff;font-size:12px;font-weight:700;border-radius:6px}
.add{display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;margin-top:12px;border-radius:10px;background:#C34725;color:#fff;font-size:16px;font-weight:700;letter-spacing:.3px}
.add.done{background:#2E8B57}
.add:active{filter:brightness(.92)}
.bar{position:absolute;left:0;right:0;bottom:0;height:76px;background:#fff;box-shadow:0 -2px 14px rgba(40,24,12,.10);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;padding:0 24px 12px;box-sizing:border-box}
.nb{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:56px;font-size:13px;font-weight:600;color:#6F665E}
.nb span{margin-top:4px}
.nb.active{color:#C34725}
.nb .disc{margin-top:-36px;display:flex;align-items:center;justify-content:center;width:60px;height:60px;border-radius:30px;background:#C34725;border:5px solid #fff;box-sizing:border-box;box-shadow:0 4px 12px rgba(195,71,37,.35);color:#fff}
.nb.active span.lbl{margin-top:4px}

.scroll.menu{bottom:0}
.scroll.menu .grid{padding-bottom:130px}
.avatar{border-radius:22px;background:rgba(20,12,8,.32)}
.glass{background:linear-gradient(135deg,rgba(70,48,36,.62),rgba(28,18,13,.42));-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 1px rgba(255,255,255,.5),inset 0 -1px 2px rgba(255,255,255,.1),0 10px 28px rgba(30,16,8,.35)}
.dock{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) * .3 + 4px);display:flex;gap:12px;z-index:5}
.gnav{flex:1;height:66px;border-radius:33px;padding:6px;display:flex;box-sizing:border-box}
.gb{flex:1;position:relative;display:flex;align-items:center;justify-content:center;border-radius:27px;color:#FFF3DB;transition:background .25s}
.gb.on,.sbtn.on{background:rgba(255,255,255,.22);box-shadow:inset 0 1px 1px rgba(255,255,255,.5)}
.gbadge{position:absolute;top:6px;right:calc(50% - 26px);min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:8px;background:#C34725;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sbtn{width:66px;height:66px;border-radius:33px;flex:none;display:flex;align-items:center;justify-content:center;color:#FFF3DB}
.phead{height:150px;background:#C34725;color:#FFF3DB;font-size:44px;font-weight:700;display:flex;align-items:flex-end;padding:0 40px 18px;box-sizing:border-box}
.plist{padding:12px 16px 130px}
.lrow{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid #EFE6DA}
.lrow .price{font-size:20px}
.lrow.total{border-bottom:0}
.mini{width:44px;height:44px;border-radius:22px;background:#C34725;color:#fff;font-size:24px;font-weight:700;margin-left:12px;flex:none}
.empty{padding:36px 8px;text-align:center;color:#6F665E;font-size:16px}
.qin{box-sizing:border-box;width:100%;height:48px;border:1px solid #EFE6DA;border-radius:24px;padding:0 18px;font:inherit;font-size:16px;background:#fff;color:#1D1B19;margin-bottom:8px}
.drawer{position:absolute;top:0;left:0;right:0;bottom:0;z-index:20;animation:dslide .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes dslide{from{transform:translateX(-100%)}to{transform:none}}
.dpanel{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;background:#f6cd5c;scrollbar-width:none}
.dpanel::-webkit-scrollbar{display:none}
.dtop{position:relative;height:270px;background:#1b1f45;border-radius:0 0 50% 50% / 0 0 100% 100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.dtitle{position:absolute;top:calc(env(safe-area-inset-top,0px) + 54px);left:0;right:0;text-align:center;font-size:22px;font-weight:700;color:#f1d489}
.dclose{position:absolute;left:8px;top:44px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#f1d489;z-index:2}
.cic{position:absolute;left:0;top:0;width:60px;height:60px;border-radius:30px;background:rgba(255,255,255,.07);color:#9a9ed6;display:flex;align-items:center;justify-content:center;will-change:transform,opacity}
.nt .cic{transition:none}
.cic.on{background:rgba(255,255,255,.13);color:#f1d489}
.cic svg{width:56%;height:56%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 18px;padding:26px 22px 40px}
.dcard{background:#fff;color:#1c2a25;border-radius:32px;padding:10px 8px 16px;text-align:center;box-shadow:0 10px 16px -6px rgba(120,80,0,.28);display:flex;flex-direction:column;align-items:center}
.dcard img{width:100%;height:110px;object-fit:contain}
.cic img{width:70%;height:70%;object-fit:contain;pointer-events:none}
.catpage{position:absolute;top:0;left:0;right:0;bottom:0;z-index:40;background:#e8ebea}
.catpage iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.subback{position:absolute;left:8px;top:calc(env(safe-area-inset-top,0px) + 12px);width:44px;height:44px;border-radius:22px;background:rgba(20,12,8,.5);color:#FFF3DB;display:flex;align-items:center;justify-content:center;z-index:2}
.gtitle{padding:22px 40px 10px;font-size:26px;font-weight:700;color:#2A211B;letter-spacing:.5px;text-transform:uppercase}
.dcard b{margin-top:8px;font-size:18px}
.dcard small{font-size:12px;font-weight:600;opacity:.7}
@media (prefers-reduced-motion: reduce){.drawer{animation:none}.cic{transition:none}}

.dlight{background:#FFFCF7}
.banner .dclose{color:#FFF3DB}
.mscroll{background:#161d1b}
.mhead{position:relative;height:100px}
.mhero{margin:0 16px;height:360px;border-radius:40px;background:#f6cd5c;color:#1c2a25;position:relative;overflow:hidden;text-align:center}
.mhero small{display:block;margin-top:24px;font-size:16px;font-weight:600}
.mhero h2{margin:6px 24px 0;font-size:60px;line-height:.9;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.mhero img{position:absolute;left:50%;bottom:70px;height:150px;width:auto;max-width:80%;transform:translateX(-50%);object-fit:contain}
.mpill{position:absolute;left:14px;right:14px;bottom:14px;height:52px;display:flex;gap:8px}
.mpill .info{flex:1;border-radius:26px;background:rgba(28,42,37,.45);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 20px;font-size:15px;font-weight:600;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.mpill button{width:62px;border-radius:26px;background:rgba(28,42,37,.55);color:#fff;font-size:28px;font-weight:600}
.mcats{background:#f6cd5c;margin-top:10px;padding-bottom:140px;min-height:calc(100% - 110px);box-sizing:border-box}
.mcats .dtop{height:175px;border-radius:0;overflow:visible;background:#1e2250}
.mcats .dtitle{top:30px}.arcsvg{position:absolute;left:0;top:0;pointer-events:none}
.mcats .dgrid{padding-top:30px}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* iOS home-screen app: position:fixed is capped short, so size the page from the real screen height */
(function () {
  function fit() {
    var standalone = navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
    var h = (standalone && window.innerHeight > window.innerWidth) ? Math.max(screen.width, screen.height) + 'px' : '';
    document.documentElement.style.height = h; document.body.style.height = h;
  }
  fit(); window.addEventListener('resize', fit); window.addEventListener('orientationchange', fit);
})();
</script>
<script>
(function () {
  var CATS = {};
  var ORDER = [];
  function addCat(slug, label, bg, group) {
    CATS[slug] = { slug: slug, label: label, title: label.toUpperCase(), bg: bg, side: ORDER.length % 2 ? 'l' : 'r', group: group || 'Food', items: [] };
    ORDER.push(slug);
  }
  var BGS = ['#DF9437', '#1B3E37', '#D0632B', '#C34725', '#2A211B', '#8A5A2B'];
  [['rice-spaghetti-noodles', 'Rice, Spaghetti & Noodles'],
   ['swallow-soups', 'Swallow & Soups'],
   ['beans-plantain', 'Beans & Plantain'],
   ['yam-potato', 'Yam & Potato Dishes'],
   ['chicken-turkey', 'Chicken & Turkey'],
   ['beef-fish-seafood', 'Beef, Fish & Seafood'],
   ['grills-bbq', 'Grills & BBQ'],
   ['burgers-sandwiches-shawarma', 'Burgers, Sandwiches & Shawarma'],
   ['pizza', 'Pizza'],
   ['small-chops-snacks', 'Small Chops & Snacks'],
   ['breakfast-specials', 'Breakfast & Specials'],
   ['salads-sides', 'Salads & Sides']].forEach(function (c, i) { addCat(c[0], c[1], BGS[i % BGS.length], 'Food'); });
  [['soft-drinks-sodas', 'Soft Drinks & Sodas'],
   ['fresh-juices', 'Fresh Juices'],
   ['smoothies-milkshakes', 'Smoothies & Milkshakes'],
   ['water', 'Water']].forEach(function (c, i) { addCat(c[0], c[1], BGS[(i + 12) % BGS.length], 'Drinks'); });
  var state = { screen: 'main', cat: ORDER[0], favs: {}, cart: [], q: '' };
  var app = document.getElementById('app');

  /* Your pictures go in these folders, named by category slug, e.g. images/posters/pizza.png
     images/posters/<slug>.png  -> poster shown in the hamburger menu and on the category page
     images/icons/<slug>.png    -> placeholder shown in the sliding category carousel
     Until a file exists, that slot is simply empty. */
  function pic(kind, slug, cls) {
    return '<img class="' + cls + '" src="images/' + kind + '/' + slug + '.png" alt="" onerror="this.style.display=\'none\'">';
  }

  var ICON = {
    arrow: '<svg width="22" height="12" viewBox="0 0 22 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h16M14 3l5 5-5 5"/></svg>',
    bag: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
    bag24: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
    burger: '<svg width="26" height="20" viewBox="0 0 26 20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M3 3h20M3 10h20M3 17h20"/></svg>',
    back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
    home: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>',
    fork: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3v6a3 3 0 0 0 6 0V3M9 3v18"/><path d="M17 21V3c-2.5 1.5-3.5 4-3.5 7.5H17"/></svg>',
    logo: '<svg width="38" height="46" viewBox="0 0 38 46" fill="none" stroke="#FBEBCB" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17C5 9 11 4 19 4s14 5 14 13z"/><path d="M5 21h28"/><path d="M5 37h28v1c0 4-4 6-8 6H13c-4 0-8-2-8-6z"/><text x="19" y="33" text-anchor="middle" fill="#FBEBCB" stroke="none" font-size="7.6" font-weight="700" style="font-family:\'Saira Semi Condensed\',sans-serif;letter-spacing:.2px">BURGER</text></svg>'
  };
  function heart(on) {
    return '<svg width="22" height="22" viewBox="0 0 24 24" fill="' + (on ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>';
  }
  function cart() {
    return '<button class="cartbtn" aria-label="Cart">' + ICON.bag + '<span class="cartn">(' + state.cart + ')</span><span class="cw">CART</span></button>';
  }
  var ICON2 = {
    search: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
    user: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>',
    close: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    fav: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>'
  };
  var N = ORDER.length, car = 3 * ORDER.length, cpos = 3 * ORDER.length, raf = 0, drag = null, justDragged = false;

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function money(p) { return parseFloat(String(p).replace(/[^0-9.]/g, '')) || 0; }
  function allItems() {
    var r = [];
    ORDER.forEach(function (k) { CATS[k].items.forEach(function (it, i) { r.push({ key: k + i, cat: k, it: it }); }); });
    return r;
  }
  var FEATURED = { key: 'featured', cat: ORDER[7], it: { n: 'Double Double', p: '$12.99' } };
  function find(key) { if (key === 'featured') return FEATURED; var a = allItems(); for (var i = 0; i < a.length; i++) if (a[i].key === key) return a[i]; }
  function hdr() {
    return '<div class="hdr"><button class="iconbtn" data-drawer="1" aria-label="Menu">' + ICON.burger + '</button>' +
      '<button class="iconbtn avatar" data-profile="1" aria-label="Profile">' + ICON2.user + '</button></div>';
  }
  function nav(active) {
    function b(id, ic, l) {
      var badge = id === 'cart' ? '<span class="gbadge"' + (state.cart.length ? '' : ' hidden') + '>' + state.cart.length + '</span>' : '';
      return '<button class="gb' + (active === id ? ' on' : '') + '" data-go="' + id + '" aria-label="' + l + '">' + ic + badge + '</button>';
    }
    return '<nav class="dock"><div class="gnav glass">' + b('home', ICON.home, 'Home') + b('favs', ICON2.fav, 'Favorite') + b('cart', ICON.bag24, 'Cart') + '</div>' +
      '<button class="sbtn glass' + (active === 'search' ? ' on' : '') + '" data-go="search" aria-label="Search">' + ICON2.search + '</button></nav>';
  }
  function card(k) {
    var c = CATS[k];
    return '<button class="card ' + c.side + '" data-open="' + k + '" aria-label="' + c.label + '" style="background:' + c.bg + '">' +
      pic('posters', c.slug, '') + '<span class="ctitle">' + c.title + '</span><span class="pill">' + ICON.arrow + '</span></button>';
  }
  function menuHTML() {
    var c = CATS[state.cat];
    var tiles = c.items.map(function (it, i) {
      var key = state.cat + i, on = !!state.favs[key];
      return '<div class="tile"><div class="trow"><div style="min-width:0"><div class="name">' + esc(it.n) + '</div><div class="sub">' + it.s + '</div></div>' +
        '<button class="heart' + (on ? ' on' : '') + '" data-fav="' + key + '" aria-label="Favorite" aria-pressed="' + on + '">' + heart(on) + '</button></div>' +
        '<div class="prow"><span class="price">' + it.p + '</span>' + (it.w ? '<span class="was">' + it.w + '</span><span class="badge">-12%</span>' : '') + '</div>' +
        '<button class="add" data-add="' + key + '">Add to cart</button></div>';
    }).join('');
    return '<div class="screen" data-screen="menu"><div class="scroll menu">' +
      '<div class="hero ' + c.side + '" style="background:' + c.bg + '">' + pic('posters', c.slug, 'himg') + '<span class="htitle">' + c.title + '</span></div>' +
      (tiles ? '<div class="grid">' + tiles + '</div>' : '<p class="empty">No items yet.</p>') + '</div>' + hdr() + nav('menu') + '</div>';
  }
  function pageHTML(title, body, active) {
    return '<div class="screen" data-screen="' + active + '"><div class="scroll menu"><div class="phead">' + title + '</div><div class="plist">' + body + '</div></div>' + hdr() + nav(active) + '</div>';
  }
  function rowHTML(f, extra) {
    return '<div class="lrow"><div style="min-width:0"><div class="name">' + esc(f.it.n) + '</div><div class="sub">' + CATS[f.cat].label + '</div></div>' +
      '<div style="display:flex;align-items:center"><span class="price">' + f.it.p + '</span>' + (extra || '') + '</div></div>';
  }
  function favsHTML() {
    var rows = allItems().filter(function (f) { return state.favs[f.key]; }).map(function (f) {
      return rowHTML(f, '<button class="heart on" data-fav="' + f.key + '" aria-label="Remove favorite">' + heart(true) + '</button>');
    }).join('');
    return pageHTML('FAVORITES', rows || '<p class="empty">Tap the heart on a dish to save it here.</p>', 'favs');
  }
  function cartHTML() {
    var total = 0;
    var rows = state.cart.map(function (k) { var f = find(k); total += money(f.it.p); return rowHTML(f); }).join('');
    if (rows) rows += '<div class="lrow total"><span class="name">Total</span><span class="price">$' + total.toFixed(2) + '</span></div>';
    return pageHTML('CART', rows || '<p class="empty">Your cart is empty. Add a dish from the menu.</p>', 'cart');
  }
  function resultsHTML(q) {
    q = q.trim().toLowerCase();
    if (!q) return '<p class="empty">Type a dish name to search.</p>';
    var r = allItems().filter(function (f) { return f.it.n.toLowerCase().indexOf(q) > -1 || CATS[f.cat].label.toLowerCase().indexOf(q) > -1; });
    return r.length ? r.map(function (f) { return rowHTML(f, '<button class="mini" data-add="' + f.key + '" aria-label="Add to cart">+</button>'); }).join('') : '<p class="empty">No dishes match your search.</p>';
  }
  function searchHTML() {
    return pageHTML('SEARCH', '<input id="q" class="qin" type="search" placeholder="Search the menu" autocomplete="off" value="' + esc(state.q) + '"><div id="sres">' + resultsHTML(state.q) + '</div>', 'search');
  }
  function ground() {
    var s = state.screen;
    var top = s === 'main' ? '#161d1b' : s === 'menu' ? CATS[state.cat].bg : '#C34725';
    var bottom = s === 'main' ? '#f6cd5c' : '#FFFFFF';
    document.documentElement.style.background = 'linear-gradient(to bottom,' + top + ' 50%,' + bottom + ' 50%)';
  }
  var lastScreen = null;
  function render() {
    var s = state.screen;
    var sc = app.querySelector('.scroll'), keep = (sc && lastScreen === s + state.cat) ? sc.scrollTop : 0;
    lastScreen = s + state.cat;
    app.innerHTML = s === 'main' ? mainHTML() : s === 'menu' ? menuHTML() : s === 'favs' ? favsHTML() : s === 'cart' ? cartHTML() : searchHTML();
    ground();
    if (keep) { var n = app.querySelector('.scroll'); if (n) n.scrollTop = keep; }
    if (document.getElementById('car')) { carShape(); carPlace(cpos); }
  }
  function updBadge() {
    var bs = app.querySelectorAll('.gbadge');
    for (var i = 0; i < bs.length; i++) { bs[i].textContent = state.cart.length; bs[i].hidden = !state.cart.length; }
  }

  /* Hamburger drawer: curved, slidable category carousel */
  function drawerHTML() {
    return '<div class="drawer" id="drawer"><div class="dpanel dlight"><div class="banner"><img src="images/hero.png" alt="">' +
      '<div class="logo">' + ICON.logo + '</div><button class="dclose" data-closedrawer="1" aria-label="Close menu">' + ICON2.close + '</button></div>' +
      ORDER.map(function (k, i) {
        var g = CATS[k].group, prev = i ? CATS[ORDER[i - 1]].group : 'Food';
        return (g !== prev ? '<div class="gtitle">' + esc(g) + '</div>' : '') + card(k);
      }).join('') + '</div></div>';
  }
  function mgridHTML(cat) {
    var c = CATS[cat];
    if (!c.items.length) return '<p class="empty" style="grid-column:1/-1">No items yet.</p>';
    return c.items.map(function (it) {
      return '<button class="dcard" data-open="' + cat + '"><b>' + esc(it.n) + '</b><small>' + it.p + '</small></button>';
    }).join('');
  }
  function mainHTML() {
    var ic = '';
    for (var k = 0; k < N * 7; k++) {
      var key = ORDER[k % N];
      ic += '<button class="cic" data-ci="' + k + '" aria-label="' + CATS[key].label + '">' + pic('icons', key, '') + '</button>';
    }
    return '<div class="screen" data-screen="main"><div class="scroll mscroll">' +
      '<div class="mhead"><div class="logo">' + ICON.logo + '</div>' + hdr() + '</div>' +
      '<section class="mhero"><small>Today\u2019s favorite</small><h2>' + esc(FEATURED.it.n) + '</h2><img src="images/burger.png" alt="">' +
      '<div class="mpill"><div class="info"><span>' + esc(FEATURED.it.n) + '</span><span>' + FEATURED.it.p + '</span></div><button data-add="featured" aria-label="Add to cart">+</button></div></section>' +
      '<div class="mcats"><div class="dtop" id="car"><svg class="arcsvg" id="arcsvg" aria-hidden="true"></svg><div class="dtitle" id="ctitle"></div>' + ic + '</div><div class="dgrid" id="mgrid" data-c=""></div></div>' +
      '</div>' + nav('home') + '</div>';
  }
  function carShape() {
    var el = document.getElementById('car'), sv = document.getElementById('arcsvg'); if (!el || !sv) return;
    var W = el.clientWidth, H = el.clientHeight, a = W / 2, c1 = 78, s1 = Math.round(W * 0.19), s2 = Math.round(W * 0.27);
    var R1 = a * a / (2 * s1) + s1 / 2, R2 = a * a / (2 * s2) + s2 / 2, y1 = c1 - s1, y2 = H - s2;
    el.style.clipPath = 'path("M0 0H' + W + 'V' + y2 + 'A' + R2 + ' ' + R2 + ' 0 0 1 0 ' + y2 + 'Z")';
    sv.setAttribute('width', W); sv.setAttribute('height', H);
    sv.innerHTML = '<path d="M0 0H' + W + 'V' + y1 + 'A' + R1 + ' ' + R1 + ' 0 0 1 0 ' + y1 + 'Z" fill="#12153a"/>' +
      '<path d="M' + W + ' ' + y1 + 'A' + R1 + ' ' + R1 + ' 0 0 1 0 ' + y1 + '" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="1.5"/>' +
      '<path d="M' + (a - 11) + ' ' + c1 + 'L' + a + ' ' + (c1 - 10) + 'L' + (a + 11) + ' ' + c1 + 'Z" fill="#1e2250"/>';
  }
  function carPlace(pos) {
    var el = document.getElementById('car'); if (!el) return;
    var W = el.clientWidth, H = el.clientHeight, a = W / 2, s2 = Math.round(W * 0.27);
    var R2 = a * a / (2 * s2) + s2 / 2, cy = H - R2, Rr = R2 - 46, st = 22;
    var bs = el.querySelectorAll('.cic'), c = Math.round(pos);
    for (var i = 0; i < bs.length; i++) {
      var k = +bs[i].getAttribute('data-ci'), d = k - pos, th = d * st * Math.PI / 180;
      var x = a + Rr * Math.sin(th), y = cy + Rr * Math.cos(th);
      var ad = Math.abs(d), sc = Math.max(0.6, 1.15 - 0.28 * ad), o = Math.max(0, 1 - 0.3 * ad);
      bs[i].style.transform = 'translate(' + (x - 30) + 'px,' + (y - 30) + 'px) rotate(' + (-d * st) + 'deg) scale(' + sc + ')';
      bs[i].style.opacity = o;
      bs[i].style.pointerEvents = o < 0.1 ? 'none' : 'auto';
      bs[i].classList.toggle('on', k === c);
    }
    var cc = ORDER[((c % N) + N) % N], g = document.getElementById('mgrid');
    if (g && g.getAttribute('data-c') !== cc) { g.innerHTML = mgridHTML(cc); g.setAttribute('data-c', cc); }
    var t = document.getElementById('ctitle');
    if (t && t.textContent !== CATS[cc].label) t.textContent = CATS[cc].label;
  }
  function carNorm() {
    var m = Math.floor((car - 3 * N) / N);
    if (m) { car -= m * N; cpos -= m * N; carPlace(cpos); }
  }
  function carAnimate(target) {
    cancelAnimationFrame(raf);
    car = target;
    var from = cpos, dist = target - from, dur = Math.min(420, 200 + 90 * Math.abs(dist)), t0 = performance.now();
    if (!dist) { carNorm(); return; }
    function step(now) {
      var t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 3);
      cpos = from + dist * e; carPlace(cpos);
      if (t < 1) raf = requestAnimationFrame(step); else carNorm();
    }
    raf = requestAnimationFrame(step);
  }
  function openDrawer() {
    if (document.getElementById('drawer')) return;
    app.insertAdjacentHTML('beforeend', drawerHTML());
  }
  /* Categories that open their own page instead of the default category screen */
  var PAGES = { 'rice-spaghetti-noodles': 'pages/rice-spaghetti-noodles.html' };
  function openCat(k) {
    if (PAGES[k]) {
      if (document.getElementById('catpage')) return;
      app.insertAdjacentHTML('beforeend', '<div class="catpage" id="catpage"><iframe src="' + PAGES[k] + '" title="' + esc(CATS[k].label) + '"></iframe>' +
        '<button class="subback" data-closesub="1" aria-label="Back">' + ICON.back + '</button></div>');
      return;
    }
    state.screen = 'menu'; state.cat = k; render();
  }
  function closeDrawer() { var d = document.getElementById('drawer'); if (d) d.parentNode.removeChild(d); }

  app.addEventListener('pointerdown', function (e) {
    var el = e.target.closest ? e.target.closest('#car') : null;
    if (!el) return;
    cancelAnimationFrame(raf);
    var m = Math.floor((cpos - 3 * N) / N); cpos -= m * N; car -= m * N;
    drag = { x: e.clientX, p: cpos, moved: false, id: e.pointerId, el: el, s: [{ t: performance.now(), x: e.clientX }] };
  });
  app.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var dx = e.clientX - drag.x, step = drag.el.clientWidth * 0.18;
    if (!drag.moved && Math.abs(dx) > 4) { drag.moved = true; try { drag.el.setPointerCapture(drag.id); } catch (_) {} }
    if (drag.moved) {
      cpos = Math.max(N, Math.min(6 * N - 1, drag.p - dx / step)); carPlace(cpos);
      drag.s.push({ t: performance.now(), x: e.clientX }); if (drag.s.length > 5) drag.s.shift();
    }
  });
  function endDrag() {
    if (!drag) return;
    var d = drag; drag = null;
    if (!d.moved) { car = Math.round(cpos); return; }
    justDragged = true; setTimeout(function () { justDragged = false; }, 60);
    var s = d.s, v = 0, now = performance.now();
    if (s.length > 1) {
      var f = s[0], l = s[s.length - 1];
      if (l.t > f.t && now - l.t < 120) v = -(l.x - f.x) / (l.t - f.t) / (d.el.clientWidth * 0.18);
    }
    var tgt = Math.round(cpos + Math.max(-4, Math.min(4, v * 180)));
    carAnimate(Math.max(N, Math.min(6 * N - 1, tgt)));
  }
  app.addEventListener('pointerup', endDrag);
  app.addEventListener('pointercancel', endDrag);
  window.addEventListener('resize', function () { carShape(); carPlace(cpos); });
  app.addEventListener('input', function (e) {
    if (e.target.id === 'q') { state.q = e.target.value; document.getElementById('sres').innerHTML = resultsHTML(state.q); }
  });
  app.addEventListener('click', function (e) {
    var t = e.target;
    while (t && t !== app) {
      if (t.getAttribute) {
        var o = t.getAttribute('data-open'), f = t.getAttribute('data-fav'), a = t.getAttribute('data-add'), g = t.getAttribute('data-go'), ci = t.getAttribute('data-ci');
        if (t.getAttribute('data-drawer')) { openDrawer(); return; }
        if (t.getAttribute('data-closedrawer')) { closeDrawer(); return; }
        if (t.getAttribute('data-closesub')) { var sb = document.getElementById('catpage'); if (sb) sb.parentNode.removeChild(sb); return; }
        if (ci !== null) {
          if (justDragged) return;
          var k = +ci;
          if (k === car) { openCat(ORDER[k % N]); } else { carAnimate(k); }
          return;
        }
        if (o) { openCat(o); return; }
        if (g) { state.screen = g === 'home' ? 'main' : g; render(); if (g === 'search') { var q = document.getElementById('q'); if (q) q.focus(); } return; }
        if (a) {
          state.cart.push(a); updBadge();
          if (t.classList.contains('add')) {
            t.textContent = 'Added'; t.className = 'add done';
            setTimeout(function () { t.textContent = 'Add to cart'; t.className = 'add'; }, 1200);
          } else {
            t.textContent = '\u2713'; setTimeout(function () { t.textContent = '+'; }, 1000);
          }
          return;
        }
        if (f) {
          state.favs[f] = !state.favs[f];
          if (state.screen === 'favs') { render(); return; }
          t.className = 'heart' + (state.favs[f] ? ' on' : '');
          t.setAttribute('aria-pressed', String(!!state.favs[f]));
          t.innerHTML = heart(!!state.favs[f]);
          return;
        }
      }
      t = t.parentNode;
    }
  });
  render();
  if ('serviceWorker' in navigator) var hadSW = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () { if (hadSW && !reloaded) { reloaded = true; location.reload(); } });
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (r) { r.update(); }).catch(function () {}); });
})();
</script>
</body>
</html>
