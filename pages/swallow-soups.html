<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swallow &amp; Soups</title>
<style>
:root{
  --paper:#8c0c18; --ink:#1d1a3d; --ink-soft:#6f6b8f; --line:#e6e3f2;
  --sky:radial-gradient(120% 90% at 8% 0%,#d4192b 0%,#b3121f 46%,#8c0c18 100%);   /* red */
  --btn:#111;
  --wood:#653613; --wood-hi:#7f4a1c; --yellow:#f3d054; --orange-a:#2b2b2b; --orange-b:#111;
  --display:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --serif:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#b3121f;font-family:var(--body);color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--orange-b);outline-offset:2px}

.app{
  --T:min(72vw,32dvh,300px);
  --aw:min(100vw,430px);
  --px:50;--py:50;--ps:80;            /* where the soup plate sits in the tray */
  position:relative;max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  background:var(--sky);overflow:hidden;overflow:clip;
}
.app[data-arr="1"]{--px:64;--py:48;--ps:48}
@media (min-width:431px){.app{box-shadow:0 0 60px rgba(90,57,53,.15)}}
@media (max-height:720px){.app{--T:min(60vw,27dvh,240px)}}
.app.nt *{transition:none!important}

/* ---------- header ---------- */
.top{display:flex;align-items:center;padding:calc(10px + max(var(--sat,0px),env(safe-area-inset-top,0px))) 14px 0 14px;height:calc(58px + max(var(--sat,0px),env(safe-area-inset-top,0px)))}
.top{justify-content:flex-end}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ib{position:relative;width:40px;height:40px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:#fff}
.ib svg{width:22px;height:22px}
.badge{position:absolute;top:3px;right:1px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--orange-b);color:#fff;font:700 10px/17px var(--body);text-align:center;box-shadow:0 0 0 2px var(--paper)}
.badge.pop{animation:badgepop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes badgepop{0%{transform:scale(.3)}100%{transform:scale(1)}}
.tagrow{padding:2px 18px 0}
.steps{display:flex;gap:6px;padding:4px 16px 0}
.steps span{font:700 12px/1 var(--body);padding:8px 13px;border-radius:999px;background:rgba(255,255,255,.55);color:var(--ink-soft);transition:background .25s,color .25s}
.steps[data-s="1"] span:nth-child(1),.steps[data-s="2"] span:nth-child(2),.steps[data-s="3"] span:nth-child(3){background:var(--btn);color:#fff}

/* ---------- stage ---------- */
.stage{position:relative;z-index:3;flex:1 1 auto;display:grid;place-items:center;padding:8px 0 12px}
.deco{position:absolute;inset:0;pointer-events:none}
.deco svg{position:absolute}
.deco.jig svg{animation:jig .8s ease both}
@keyframes jig{40%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}100%{transform:none}}
.tray-wrap{position:relative;width:var(--T);aspect-ratio:1;touch-action:pan-y;user-select:none;-webkit-user-select:none;outline-offset:6px;border-radius:50%}

}
.tray-inner{position:absolute;inset:0;transition:opacity .35s}
.app[data-arr="0"] .tray-inner{opacity:0}

/* the soup plate: big on the home screen, smaller once the swallow/protein steps start */
.plate,.ring{position:absolute;left:calc(var(--px)*1%);top:calc(var(--py)*1%);width:calc(var(--ps)*1%);aspect-ratio:1;
  transition:left .6s cubic-bezier(.3,.8,.3,1),top .6s cubic-bezier(.3,.8,.3,1),width .6s cubic-bezier(.3,.8,.3,1),opacity .3s}
.plate{transform:translate(-50%,-50%);will-change:transform}
.plate.gone{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.6);transition:left .6s,top .6s,width .6s,opacity .3s,transform .3s}
.plate.swapping{opacity:0;transition:none}
.plate .pa{position:absolute;inset:0}
.plate .pa svg,.plate .pa img{width:100%;height:100%;display:block;object-fit:contain;filter:drop-shadow(0 7px 7px rgba(60,30,10,.3))}
.plate .pp{position:absolute;inset:0}
.ring{transform:translate(-50%,-50%);border-radius:50%;border:2px dashed rgba(255,255,255,.35);opacity:0;pointer-events:none}
.tray:not(.has-plate) .ring{opacity:1}
.empty{position:absolute;left:25%;right:25%;top:44%;text-align:center;font:700 11.5px/1.35 var(--body);color:#6f5b32;opacity:0;transition:opacity .3s;pointer-events:none}
.app[data-arr="0"] .tray:not(.has-plate) .empty{opacity:1}

.it{position:absolute;left:calc(var(--x)*1%);top:calc(var(--y)*1%);width:calc(var(--s)*1%);aspect-ratio:1;
  transform:translate(-50%,-50%) rotate(var(--r,0deg));display:block}
.it svg,.it img{width:100%;height:100%;display:block;object-fit:contain;pointer-events:none}
.pop{animation:drop .55s cubic-bezier(.2,1.25,.4,1) both}
@keyframes drop{
  from{transform:translate(-50%,-110%) rotate(var(--r,0deg)) scale(.45);opacity:0}
  to{transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(1);opacity:1}
}

.flyer2{position:fixed;z-index:30;pointer-events:none;will-change:transform}
.flyer2 svg,.flyer2 img{width:100%;height:100%;display:block;object-fit:contain}
.plate .pa img.ph,.flyer2 img.ph{border-radius:50%;object-fit:cover}

/* ---------- take-away pack: 3D black container, clear snap-on lid, nylon bag ---------- */
.pack{position:absolute;left:50%;top:50%;width:84%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:6;pointer-events:none}
.pack[hidden]{display:none}
.pk3d{position:absolute;inset:0;overflow:visible}
.pk3d canvas{position:absolute;left:-45%;top:-45%;width:190%;height:190%;display:block}
.pk-clip{position:absolute;inset:0}
.pk-food{position:absolute;left:0;top:0;width:var(--T);height:calc(var(--T)*.722);transform-origin:0 0}
.pk-food .it svg{filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}

/* ---------- soup menu (big, slides sideways) + narrow Add to cart card ---------- */
.menu{--sw:min(40vw,160px);position:relative;z-index:2;padding:0 0 12px}
.rail-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 18px 6px}
.rail-head b{font:700 20px/1 var(--display);color:var(--ink)}
.rail-head span{font:600 12.5px/1 var(--body);color:var(--ink)}
.rail{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;scroll-padding:0 18px;padding:8px 18px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch;transition:opacity .25s}
.rail::-webkit-scrollbar{display:none}
.app[data-arr="1"] .rail{opacity:.35;pointer-events:none}
.sc{flex:0 0 auto;width:var(--sw);scroll-snap-align:start;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.sd{position:relative;display:grid;place-items:center;width:var(--sw);height:var(--sw);border-radius:50%;overflow:hidden;background:#fffdf6;border:3px solid #fffdf6;padding:0;transition:transform .15s,border-color .15s}
.sd svg{width:100%;height:100%;object-fit:contain;pointer-events:none;transform:scale(1.42) rotate(var(--roll,0deg));will-change:transform}
.sd img{width:100%;height:100%;object-fit:cover;border-radius:50%;pointer-events:none;transform:rotate(var(--roll,0deg));will-change:transform}
.sc:active .sd{transform:scale(.94)}
.sc[aria-pressed="true"] .sd{border-color:#111}
.sc .tick{right:8px;top:8px}
.sc[aria-pressed="true"] .tick{display:grid}
.sn{font:700 16px/1.1 var(--body);color:var(--ink);text-align:center}
.sp{font:600 14px/1 var(--body);color:var(--ink);opacity:.75}
.dock{position:relative;z-index:2;padding:0 0 calc(16px + env(safe-area-inset-bottom,0px) + var(--ckh,0px));transition:padding .3s}
.panel{width:min(86%,330px);margin:0 auto;background:#fbfaff;border-radius:24px;padding:14px 16px 16px;text-align:left}
.infoRow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 12px}
.infoRow>div:first-child{min-width:0}
.name{font:700 18px/1.15 var(--body);color:var(--ink);transition:opacity .25s}
.price{font:700 26px/1 var(--body);color:var(--ink);white-space:nowrap}
.price.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.1)}}
.summary:empty{display:none}
.summary{margin:3px 0 0;padding:0;font:600 12px/1.35 var(--body);color:var(--ink-soft)}
.cta,.sheet-cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:52px;border:0;border-radius:16px;background:var(--btn);color:#fff;font:700 16px/1 var(--body);transition:transform .15s,opacity .2s}
.cta svg,.sheet-cta svg{width:21px;height:21px}
.cta:active,.sheet-cta:active{transform:scale(.98)}
.cta[aria-disabled="true"]{opacity:.3}
.sheet-cta{margin:16px 0 0}

/* ---------- motion ---------- */
.tray-wrap{animation:trayIn .8s cubic-bezier(.2,.9,.3,1.1) both}
.sc{animation:cardIn .65s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:calc(var(--i,0)*80ms + 300ms)}
.rail-head{animation:fadeIn .6s .2s both}
.panel{animation:panelUp .7s .5s cubic-bezier(.2,.9,.3,1.05) both}
.cta:not([aria-disabled="true"]){animation:ctaPop .5s}
.sc[aria-pressed="true"] .sd{animation:selPop .45s}
@keyframes trayIn{from{opacity:0;transform:scale(.78) translateY(20px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateX(40px) scale(.85)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes panelUp{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes ctaPop{40%{transform:scale(1.045)}}
@keyframes selPop{40%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){.tray-wrap,.sc,.rail-head,.panel,.cta,.sd{animation:none!important}}

/* ---------- sheets ---------- */
.shO .ck-bar{transform:translateY(105%)!important}
.scrim{position:fixed;inset:0;background:rgba(40,0,6,.5);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s;z-index:20}
.sheet{
  position:fixed;left:50%;bottom:0;width:min(430px,100%);z-index:21;background:#fff;border-radius:34px 34px 0 0;
  padding:22px 24px calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,105%);visibility:hidden;
  transition:transform .34s cubic-bezier(.2,.9,.3,1),visibility 0s .34s;max-height:88dvh;overflow:auto;
}
.sheet-open .scrim{opacity:1;visibility:visible;transition:opacity .25s}
.sheet-open .sheet{transform:translate(-50%,0);visibility:visible;transition:transform .34s cubic-bezier(.2,.9,.3,1)}
.sheet h2{margin:0;font:700 24px/1.1 var(--display);color:var(--ink)}
.sheet.pk{padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.pk-head{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px}
.pk-x{width:36px;height:36px;border-radius:50%;border:0;background:#eeeafa;color:var(--ink-soft);font:700 20px/1 var(--body)}
.pk-big{text-align:center;padding:0 0 6px}
.pk-art{width:min(220px,58vw,28dvh);aspect-ratio:1;margin:0 auto;background:none;border:0;border-radius:0;padding:0}
.pk-art svg,.pk-art img{filter:drop-shadow(0 8px 8px rgba(60,30,10,.28))}
.pk-art svg,.pk-art img{width:100%;height:100%;object-fit:contain}
.pk-name{margin-top:12px;font:700 27px/1.1 var(--display);color:var(--ink)}
.pk-unit{margin-top:3px;font:700 13px/1.3 var(--body);color:var(--ink-soft)}
.stepper{display:flex;align-items:center;justify-content:center;gap:26px;margin:10px 0 4px}
.stepper button{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font:700 26px/1 var(--body);color:var(--ink);display:grid;place-items:center}
.stepper button[disabled]{opacity:.35}
.stepper output{min-width:52px;text-align:center;font:700 42px/1 var(--serif);color:var(--ink)}
.total{text-align:center;margin:0 0 6px;font:700 13px/1 var(--body);color:var(--ink-soft)}
.pk-list{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px;padding:4px 0}
.pk-list.strip{display:flex;overflow-x:auto;gap:14px;padding:10px 2px 4px;scrollbar-width:none}
.pk-list.strip::-webkit-scrollbar{display:none}
.pc{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.disc{position:relative;display:grid;place-items:center;width:84px;height:84px;border-radius:0;background:none;border:0;padding:0;transition:transform .2s,filter .2s}
.disc svg,.disc img{width:100%;height:100%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 4px 4px rgba(60,30,10,.25))}
.pc[aria-pressed="true"] .disc{transform:scale(1.12)}
.pc[aria-pressed="true"] .pn{text-decoration:underline;text-underline-offset:3px}
.pk-list.strip .pc{flex:0 0 auto}
.pc:focus-visible,.pc:focus{outline:none}
.pk-list.strip .disc{width:60px;height:60px;padding:0}
.pn{font:700 12.5px/1.15 var(--body);color:var(--ink)}
.pg{font:700 11px/1 var(--body);color:var(--ink-soft)}
.tick{position:absolute;right:-3px;top:-3px;width:20px;height:20px;border-radius:50%;background:var(--orange-b);color:#fff;display:none;place-items:center;font:700 11px/1 var(--body);box-shadow:0 0 0 2px #fff}
.pc[aria-pressed="true"] .tick{display:grid}

.actions{display:flex;gap:10px}
.btn{flex:1;height:52px;border-radius:18px;border:0;font:700 15px/1 var(--body)}
.btn.main{background:var(--btn);color:#fff}
.lines{list-style:none;margin:14px 0 14px;padding:0}
.lines li{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.lines .what{flex:1;font:700 13px/1.45 var(--body);color:var(--ink)}
.lines .what small{display:block;margin-top:2px;font:700 11.5px/1.3 var(--body);color:var(--ink-soft)}
.lines .amt{font:700 17px/1.2 var(--serif);color:var(--ink)}
.lines .x{width:30px;height:30px;border-radius:50%;border:0;background:#eeeafa;color:var(--ink-soft);font:700 16px/1 var(--body)}
.sum{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 16px;font:700 14px/1 var(--body);color:var(--ink-soft)}
.sum b{font:700 26px/1 var(--serif);color:var(--ink)}
.none{margin:10px 0 20px;font:700 14px/1.5 var(--body);color:var(--ink-soft)}
.toast{
  position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translate(-50%,-14px);z-index:50;
  background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font:700 13px/1 var(--body);opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;white-space:nowrap;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}

/* ---------- orbit home screen ---------- */
/* the old soup menu + bottom panel are retired: the orbit screen replaces them */
.menu,.dock{display:none!important}
.app{background:var(--sky)}
.stage{flex:0 0 auto;height:46dvh;padding:0}
.tray-wrap{animation:none!important;opacity:0;transform:scale(.8);transition:opacity .4s ease,transform .5s cubic-bezier(.2,.9,.3,1.1)}
.app.orIn .tray-wrap{opacity:1;transform:none}
#orHalo{transition:left .75s cubic-bezier(.3,.8,.3,1),top .75s cubic-bezier(.3,.8,.3,1),width .75s cubic-bezier(.3,.8,.3,1),height .75s cubic-bezier(.3,.8,.3,1),box-shadow .5s}
.app.orGo #orHalo{box-shadow:0 22px 46px rgba(40,0,6,.5)}
.app.orGo #orHalo::after{content:"";position:absolute;inset:5%;border-radius:50%;border:2px dashed rgba(0,0,0,.14);animation:orring 1s ease both}
.app.orGo #orHalo::before{content:"";position:absolute;left:50%;top:5%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:rgba(0,0,0,.14);animation:orring 1s ease both}
@keyframes orring{0%{opacity:0}15%{opacity:1}70%{opacity:1}100%{opacity:0}}
.app.orGo .or{z-index:1;background:transparent;pointer-events:none}
.app.orGo .or-p,.app.orGo #orCart,.app.orGo #orBig,.app.orGo #orRing{opacity:0!important;pointer-events:none!important;transition:opacity .25s}
.empty{display:none!important}
.top{position:relative;z-index:6}
.or{position:absolute;inset:0;z-index:4;background:var(--sky);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;transition:opacity .35s}
#orHalo{position:absolute;border-radius:50%;will-change:transform;
  background:#fff;
  box-shadow:0 18px 50px rgba(40,0,6,.35)}
#orRing{position:absolute;border-radius:50%;border:2px dashed rgba(255,255,255,.65);pointer-events:none}
#orBig{position:absolute;z-index:3;pointer-events:none}
#orBig.orpop .or-cp{animation:orpop .4s ease-out}
@keyframes orpop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.or-p{position:absolute;z-index:4;cursor:pointer;will-change:left,top,opacity,transform}
#orBig{will-change:transform}
#orRing{border-color:rgba(255,255,255,.7)}
.or-cp{position:relative;width:100%;height:100%;pointer-events:none}
.or-cp .or-pl{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;filter:none}
.or-so{position:absolute;left:13%;top:13%;width:74%;height:74%;border-radius:50%;overflow:hidden}
.or-so svg,.or-so img{width:100%;height:100%;display:block;object-fit:cover;border-radius:50%;filter:none}
.plate .pa .or-cp *{filter:none}
#orCart{position:absolute;z-index:5;height:52px;border:0;border-radius:16px;background:#111;color:#fff;box-shadow:0 10px 24px rgba(0,0,0,.3);font:700 15px/52px var(--body);text-align:center;padding:0;touch-action:manipulation}
#orCart.hit{animation:orhit .28s ease-out}
@keyframes orhit{0%{transform:scale(.93)}100%{transform:scale(1)}}
#orHap{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

<main class="app" id="app" data-arr="0">

          <div class="name" id="name">Pick your soup</div>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.4l2 10.2a1.6 1.6 0 0 0 1.6 1.3h8a1.6 1.6 0 0 0 1.6-1.2L20 8H6.2"/><circle cx="9.5" cy="19.2" r="1.3"/><circle cx="16.5" cy="19.2" r="1.3"/></svg>
        <span>Add to cart</span>
      </button>
    </section>
  </div>
</main>

<script>

   a soup with a price is sold by the spoon, a free one is included. Pictures are the ones uploaded on each item. Nothing is built in. */
const CURRENCY = '₦';

const CATS = [
  {id:'swallow', label:'Swallow', hint:'Tap one, then choose how many wraps', unit:'wrap',  units:'wraps',  max:6, qty:true},
  {id:'rice',    label:'Rice',    hint:'Tap one, then choose how many spoons', unit:'spoon', units:'spoons', max:8, qty:true},
  {id:'soup',    label:'Soup',    hint:'Pick one. It goes on a plate on your tray'},
  {id:'protein', label:'Protein', hint:'Goes on top of your soup'},
  {id:'side',    label:'Sides',   hint:'Optional extras for your tray'}
];

const FOODS = [];   // filled from the admin Menu items

/* Where things land on the tray: [x%, y%, size%, rotation°] */
const WRAP_POS = [[21,35,21,-12],[33,23,21,8],[35,41,21,14],[17,50,21,-6],[46,19,20,-4],[23,23,20,10]];
const RICE_POS = [[26,68,22,0],[37,74,22,0],[19,76,22,0],[30,80,22,0],[41,66,21,0],[13,66,21,0],[45,79,21,0],[24,60,21,0]];
const SIDE_POS = {plantain:[80,25,22,8], moin:[81,77,21,-8], salad:[62,87,21,0]};
const PROTEIN_POS = [[36,36,40,-18],[64,37,40,14],[50,65,40,-6],[27,62,36,28],[73,63,36,-26],[50,22,34,6]];

/* =====================================================================
   Drawn placeholders (used until you add photos)
   ===================================================================== */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=7;for(const ch of s)h=(h*31+ch.charCodeAt(0))|0;return h}
function speckle(rn,cx,cy,R,spec,sy){
  sy=sy||1;
  return spec.map(function(s){
    let o='';
    for(let i=0;i<s.n;i++){
      const a=rn()*6.283,d=R*Math.sqrt(rn());
      const x=(cx+Math.cos(a)*d).toFixed(1),y=(cy+Math.sin(a)*d*sy).toFixed(1);
      const r=(s.r[0]+rn()*(s.r[1]-s.r[0])).toFixed(1);
      o+=s.e
        ?'<ellipse cx="'+x+'" cy="'+y+'" rx="'+r+'" ry="'+(r*.45).toFixed(1)+'" transform="rotate('+Math.round(rn()*180)+' '+x+' '+y+')" fill="'+s.c+'" opacity="'+(s.o||1)+'"/>'
        :'<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+s.c+'" opacity="'+(s.o||1)+'"/>';
    }
    return o;
  }).join('');
}
const svg=function(inner,flat){
  const sh=flat?'':'<ellipse cx="52" cy="90" rx="38" ry="7" fill="#3b2415" opacity=".07"/><ellipse cx="52" cy="89" rx="31" ry="5" fill="#3b2415" opacity=".08"/>';
  return '<svg viewBox="0 0 100 100" aria-hidden="true">'+sh+inner+'</svg>';
};

function swallowArt(f){
  return svg(
    '<path d="M16 64C12 38 32 20 50 20s38 18 34 44c-2 15-17 22-34 22S18 79 16 64Z" fill="'+f.c+'"/>'+
    '<path d="M16 64C18 79 33 86 50 86s32-7 34-22c-6 8-20 12-34 12S22 72 16 64Z" fill="'+f.d+'" opacity=".35"/>'+
    '<path d="M26 56c8 5 40 5 48 0M24 66c10 6 42 6 52 0" fill="none" stroke="'+f.d+'" stroke-opacity=".35" stroke-width="1.6" stroke-linecap="round"/>'+
    '<ellipse cx="38" cy="42" rx="15" ry="8" transform="rotate(-28 38 42)" fill="#fff" opacity=".3"/>'+
    '<path d="M38 25c4-9 20-9 24 0-6 4-18 4-24 0Z" fill="'+f.c+'" stroke="'+f.d+'" stroke-opacity=".55" stroke-width="1.5"/>'
  );
}
function riceArt(f){
  const rn=rng(hash(f.id));
  const grains=speckle(rn,50,58,28,[{c:f.g1,n:30,r:[1.8,2.8],e:1,o:.9},{c:f.g2,n:14,r:[1.6,2.4],e:1,o:.8}],.85);
  return svg(
    '<path d="M14 70C14 40 34 24 50 24s36 16 36 46c0 11-16 15-36 15S14 81 14 70Z" fill="'+f.c+'"/>'+
    '<path d="M14 70c0 11 16 15 36 15s36-4 36-15c-8 6-22 8-36 8S22 76 14 70Z" fill="#000" opacity=".12"/>'+
    grains+
    '<ellipse cx="38" cy="40" rx="13" ry="6" transform="rotate(-28 38 40)" fill="#fff" opacity=".28"/>'
  );
}
function soupArt(f){
  if(f&&f.img)return '<img class="ph" src="'+f.img+'" alt="" draggable="false">';

  if(f){

      speckle(rng(hash(f.id)),50,50,29,f.spec)+
      '<path d="M24 40A28 28 0 0 1 44 22" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="3" stroke-linecap="round"/>';

}

    }
    case 'shaki': return svg(

      '<rect x="50" y="26" width="34" height="30" rx="9" transform="rotate(12 67 41)" fill="#cfa877"/><rect x="50" y="26" width="34" height="9" rx="4" transform="rotate(12 67 31)" fill="#8a5a30" opacity=".55"/>'+

    default: return svg(
      '<ellipse cx="32" cy="52" rx="20" ry="27" transform="rotate(-6 32 52)" fill="#fffdf6" stroke="#e5d8bd" stroke-width="2"/><circle cx="32" cy="56" r="9.5" fill="#f2b92c"/><circle cx="29" cy="53" r="3" fill="#fff" opacity=".45"/>'+

}

  switch(f.id){
    case 'plantain': return svg(

      '<g fill="#e9f3cf" stroke="#7fb04a" stroke-width="1.6"><circle cx="48" cy="68" r="5.5"/><circle cx="44" cy="30" r="5"/></g>');
  }

async function swap(dir,dragDx,forceIdx){

  busy=true;

  const had=!plate.classList.contains('gone');
  const nIdx=forceIdx!=null?forceIdx:(dir>0?nextOf(idx):prevOf(idx));
  const inSlot=railSd(nIdx),exitSlot=idx>=0?railSd(idx):inSlot;

  plate.style.transform='';
  if(!had){plate.classList.add('swapping');plate.classList.remove('gone')}
  const pr=plate.getBoundingClientRect(),er=exitSlot.getBoundingClientRect(),ir=inSlot.getBoundingClientRect();
  const pcx=pr.left+pr.width/2,pcy=pr.top+pr.height/2;

  deco.classList.remove('jig');void deco.offsetWidth;deco.classList.add('jig');
  inSlot.style.opacity=0;

  const fl=document.createElement('div');fl.className='flyer2';
  fl.style.cssText='left:'+ir.left+'px;top:'+ir.top+'px;width:'+ir.width+'px;height:'+ir.height+'px';
  fl.innerHTML=art(SOUPS[nIdx]);document.body.appendChild(fl);
  const fdx=pcx-(ir.left+ir.width/2),fdy=pcy-(ir.top+ir.height/2),fs=pr.width/ir.width;
  const side=dir>0?-1:1;

  const exitMs=had?560:0,inDelay=had?260:0,inMs=780;
  let exitAnim=null;
  if(had){                                     // the old plate rolls out of the tray
    const r=pr.width/2,travel=Math.max(pr.width*1.5,260),x0=dragDx||0,kf=[];
    for(let k=0;k<=16;k++){
      const t=k/16,e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,x=x0+side*travel*e;
      kf.push({transform:rotT(x,-Math.sin(Math.PI*t)*7,1-.05*e,x/r*57.3),opacity:t>.72?Math.max(0,1-(t-.72)/.28):1});
    }
    exitAnim=plate.animate(kf,{duration:exitMs,easing:'linear',fill:'forwards'});
  }
  // the new plate rolls in from the soup menu
  const L=Math.hypot(fdx,fdy),rAvg=(ir.width/2+pr.width/2)/2,sgn=Math.abs(fdx)>6?Math.sign(fdx):-side;
  const spin=Math.max(1,Math.round(L/rAvg*57.3/360))*360,kf2=[];
  for(let k=0;k<=20;k++){
    const t=k/20,e=1-Math.pow(1-t,3);
    kf2.push({opacity:1,transform:'translate('+(fdx*e)+'px,'+(fdy*e-Math.sin(Math.PI*e)*26)+'px) rotate('+(sgn*spin*e)+'deg) scale('+(1+(fs-1)*e)+')'});
  }
  const inAnim=fl.animate(kf2,{duration:inMs,delay:inDelay,easing:'linear',fill:'both'});

  if(had){await exitAnim.finished;plate.classList.add('swapping');exitAnim.cancel()}
  $('#name').animate([{opacity:1},{opacity:0},{opacity:1}],{duration:420});
  setTimeout(function(){idx=nIdx;S.soup=SOUPS[nIdx].id;renderInfo();renderPrice()},180);
  await inAnim.finished;

  idx=nIdx;S.soup=SOUPS[nIdx].id;
  renderTray();renderInfo();renderPrice();
  plate.style.transition='none';plate.classList.remove('swapping');void plate.offsetWidth;plate.style.transition='';
  fl.remove();
  inSlot.style.opacity='';
  tray.animate([{transform:'scale(1)'},{transform:'scale(.975)'},{transform:'scale(1)'}],{duration:260,easing:'ease-out'});
  busy=false;
}

function normalize(im){
  try{
    const k=Math.min(1,800/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.max(1,Math.round(im.naturalWidth*k)),h=Math.max(1,Math.round(im.naturalHeight*k)),
          c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w,h);
    const d=x.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=-1,y1=-1;
    for(let py=0;py<h;py++)for(let px=0;px<w;px++)if(d[(py*w+px)*4+3]>16){if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py}
    if(x1<0)return null;
    const bw=x1-x0+1,bh=y1-y0+1,side=Math.round(Math.max(bw,bh)*1.04),o=document.createElement('canvas');o.width=o.height=side;
    o.getContext('2d').drawImage(c,x0,y0,bw,bh,Math.round((side-bw)/2),Math.round((side-bh)/2),bw,bh);
    return o.toDataURL('image/png');
  }catch(e){return null}
}

    if(P.qty[id]&&P.focus===id){delete P.qty[id];const ks=Object.keys(P.qty);P.focus=ks.length?ks[ks.length-1]:null}
    else if(P.qty[id]){P.focus=id}

  else if(act==='dec'&&q>1)P.qty[id]=q-1;

}

  const ids=Object.keys(P.qty);
  if(P.kind==='swallow')S.swallow=ids.length?{id:ids[0],qty:P.qty[ids[0]]}:null;
  else S[P.kind]=ids.map(function(id){return {id:id,qty:P.qty[id]}});
  const res=P.res;P=null;closeSheet();res(true);
}

    P={kind:kind,focus:null,qty:{},res:res};
    if(kind==='swallow'){const d=S.swallow||{id:LISTS.swallow[0].id,qty:1};P.qty[d.id]=d.qty;P.focus=d.id}
    if(kind!=='swallow'&&S[kind].length){S[kind].forEach(function(p){P.qty[p.id]=p.qty});P.focus=S[kind][0].id}
    openSheet(pickHTML(),'pk');
  });
}

let toastTimer;
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show')},1900);
}
function renderBadge(){}
function resetPlate(){
  S.soup=null;S.spoons=0;S.swallow=null;S.protein=[];S.drink=[];prevKeys=new Set();idx=-1;
  setArranged(false,true);setStep(1);renderPeeks();
}
async function dropIn(count){            // let the new food finish dropping onto the tray
  renderAll();
  await wait(count?420+count*90:200);
}
function cancelFlow(){
  setStep(1);
  S.swallow=null;S.protein=[];S.drink=[];S.spoons=0;
  setArranged(false);renderAll();
  flow=false;
}
async function runFlow(){
  if(flow||busy)return;
  if(!S.soup){toast('Tap a soup first');return}
  flow=true;
  setArranged(true);                      // the pale circle rolls in, then the tray settles on it
  await wait(1100);
  if(F(S.soup).spoon){
    if(!(await waitSpoons())){cancelFlow();return}
    renderPrice();
  }
  if(LISTS.swallow.length){
    setStep(2);
    if(!(await waitPick('swallow'))){cancelFlow();return}
    await dropIn(S.swallow?S.swallow.qty:0);
  }
  if(LISTS.protein.length){
    setStep(3);
    if(!(await waitPick('protein'))){cancelFlow();return}
    await dropIn(pieces().length);
  }
  if(LISTS.drink.length){
    setStep(4);
    if(!(await waitPick('drink'))){cancelFlow();return}
    renderPrice();
  }
  await packAndAdd();
  flow=false;
}

  const ty=.5+.9*s.zoom+s.lift*.25,p=.84,d=11.7+2.9*s.zoom;
  cam.position.set(0,ty+Math.sin(p)*d,Math.cos(p)*d);cam.lookAt(0,ty,0);cam.updateMatrixWorld();
  PK.bagUpdate(performance.now(),s);
  PK.rB.render(PK.sB,cam);PK.rF.render(PK.sF,cam);
  const cb=PK.cb,cw=cb.clientWidth,ch=cb.clientHeight,ox=cb.offsetLeft,oy=cb.offsetTop;
  const pr=function(x,y,z){V.set(x,y,z).project(cam);return [(V.x*.5+.5)*cw+ox,(-V.y*.5+.5)*ch+oy]};

  const q=[pr(cx-PK_HW,y,-PK_HD),pr(cx+PK_HW,y,-PK_HD),pr(cx+PK_HW,y,PK_HD),pr(cx-PK_HW,y,PK_HD)];

/* Take-away: the food sits in a black container, the clear lid snaps on, the box is
   lowered into a nylon bag that rises from below, and the bag flies to the cart. */
async function packAndAdd(){
  busy=true;
  const sf=F(S.soup),sw=S.swallow?F(S.swallow.id):null;
  const plateData={id:Date.now(),parts:parts(),total:total(true)},drinks=S.drink.map(function(d){const f=F(d.id);return {key:'drink:'+d.id,n:f.name,p:f.price,img:f.src||f.img||'',q:d.qty}});
  const addToApp=function(){
    Checkout.add({key:'swallow:'+plateData.id,n:(sf?sf.name:'Soup')+(sw?' & '+sw.name:'')+' plate',p:plateData.total,img:(sf&&(sf.src||sf.img))||''},1,null);
    drinks.forEach(function(d){Checkout.add({key:d.key,n:d.n,p:d.p,img:d.img},d.q,null)});
  };

  const tray=$('#tray'),pack=$('#pack'),pf=$('#pkFood'),p3=$('#pk3d');

  if(reduceMotion||!pkBuild()){addToApp();resetPlate();renderAll();busy=false;return}

  pf.innerHTML='';pf.style.transform='';
  pkSetFood();                                               // soup + protein in the box, swallow wraps in the bag

  pack.hidden=false;
  pkStart();

  const anims=[];
  const A=function(el,kf,opt){const a=el.animate(kf,Object.assign({fill:'both'},opt));anims.push(a);return a};
  const CEN='translate(-50%,-50%)';

  A(tray,[{opacity:1},{opacity:0}],{duration:380});
  A(p3,[{opacity:0,transform:'scale(.82)'},{opacity:1,transform:'scale(1)'}],{duration:460,easing:'cubic-bezier(.2,.9,.3,1.1)'});
  await wait(620);

  await pkTw('lid',0,560);                                   // clear lid snaps on
  await wait(160);
  await Promise.all([pkTw('lift',3.3,620),pkTw('bagA',1,450),pkTw('cx',-1.15,620),pkTw('zoom',1,700)]); // box lifts while the bag (with the swallow in it) fades in, standing still
  await wait(100);
  await pkTw('lift',.06,760);                                // box goes down into the bag mouth
  await wait(250);
  await pkTw('close',1,850);                                 // the bag mouth is pressed shut, handle slot on top
  await wait(450);

  const br=pack.getBoundingClientRect(),cr={left:innerWidth/2-10,top:innerHeight-70,width:20,height:20};
  const dx=(cr.left+cr.width/2)-(br.left+br.width/2),dy=(cr.top+cr.height/2)-(br.top+br.height/2);
  await A(pack,[{transform:CEN+' scale(1)',opacity:1},{transform:'translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px)) scale(.1)',opacity:.9}],
    {duration:580,easing:'cubic-bezier(.6,0,.9,.5)'}).finished;

  anims.forEach(function(a){a.cancel()});
  pkStop();
  pack.hidden=true;pf.innerHTML='';pf.style.transform='';
  addToApp();
  resetPlate();renderAll();
  tray.animate([{opacity:0,transform:'scale(.9)'},{opacity:1,transform:'scale(1)'}],{duration:340,easing:'ease-out'});
  busy=false;
}

    if(act==='cancel')cancelPick();

    return;
  }
  if(act==='close'){closeSheet();return}
});

  if(!orGo)orHalo.style.transform='rotate('+roll+'deg)';                       // the colour wheel turns with the swipe
  orRing.style.transform='rotate('+roll+'deg)';                                // dashes slide along the track
  orBig.style.transform='rotate('+((orTarget-orPos)*70).toFixed(2)+'deg)';     // the big plate rocks, then settles
}
function orLoop(){
  const now=performance.now(),dt=Math.min(.033,(now-(orLast||now))/1000);orLast=now;
  if(!orDrag){                                   // spring: overshoots a little and bounces home
    orVel+=(-130*(orPos-orTarget)-12*orVel)*dt;orPos+=orVel*dt;
    if(Math.abs(orTarget-orPos)<.002&&Math.abs(orVel)<.02){orPos=orTarget;orVel=0}
  }else orVel=0;
  orRender();requestAnimationFrame(orLoop);
}
let orSy=0,orSt=0,orMoved=0,orDown=null;
orEl.addEventListener('pointerdown',function(e){
  if(busy||flow||e.target.closest('#orCart'))return;
  orDrag=true;orSy=e.clientY;orSt=orTarget;orMoved=0;orDown=e.target.closest('.or-p');
  try{orEl.setPointerCapture(e.pointerId)}catch(_){}
});
orEl.addEventListener('pointermove',function(e){
  if(!orDrag)return;
  const dy=e.clientY-orSy;orMoved=Math.max(orMoved,Math.abs(dy));
  if(orMoved>6){const s=orR*OR_STEP*Math.PI/180;orPos=orSt+Math.max(-1,Math.min(1,dy/s))}   // never more than one plate per swipe
});
function orEnd(cancel){
  if(!orDrag)return;orDrag=false;
  const dy=orPos-orSt;
  if(orMoved>6||cancel){
    orTarget=dy>.2?orSt+1:dy<-.2?orSt-1:orSt;
    orPos=Math.max(orSt-1,Math.min(orSt+1,orPos));
  }else if(orDown){
    orTarget+=orMod(+orDown.dataset.i-orTarget+OR_N/2,OR_N)-OR_N/2;
  }
  orSetActive();
}
orEl.addEventListener('pointerup',function(){orEnd(false)});
orEl.addEventListener('pointercancel',function(){orEnd(true)});
orCartBtn.addEventListener('click',function(){
  try{orHap.click()}catch(_){}
  try{if(navigator.vibrate)navigator.vibrate(18)}catch(_){}
  orCartBtn.classList.remove('hit');void orCartBtn.offsetWidth;orCartBtn.classList.add('hit');
  if(busy||flow)return;
  const sf=orSoup(orMod(orTarget,OR_N));if(!sf)return;
  idx=SOUPS.indexOf(sf);S.soup=sf.id;
  renderAll();runFlow();
});
window.addEventListener('resize',orSize);
if(window.ResizeObserver)new ResizeObserver(orSize).observe(orEl);
orSize();orSetActive();orbitBuild();requestAnimationFrame(orLoop);

renderPeeks();renderAll();
Checkout.init({bar:true});
</script>
