<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Small chops &amp; snacks</title>
<style>
:root{--bg:#7b5240;--bg2:#2a1b15;--acc:#ffbd6e;--ink:#17100d;--tx:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:0}

.ex>div{padding:14px 0 6px}

.go{margin:auto 18px 22px;height:48px;border-radius:99px;background:var(--acc);color:var(--ink);font-weight:600;font-size:15px}

.edit h2{font-size:32px;font-weight:600}.edit h3{font-size:20px;font-weight:600;margin-top:6px}.edit p{font-size:12px}
.es{position:relative;display:flex;align-items:center;justify-content:center;gap:28px;margin-top:18px;width:100%}
.es .th{position:relative;width:140px;height:140px}.es .th svg{width:100%;height:100%}
.es .badge{background:#fff;top:-6px;right:-6px;min-width:26px;height:26px;font-size:13px}
.dk{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;font-size:22px;display:grid;place-items:center}
.ef{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 22px;margin-top:auto;margin-bottom:28px}
.ef svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.6}
.done{background:var(--ink);color:#fff;height:40px;width:130px;border-radius:99px;font-weight:600}
.grade{display:flex;background:#fff;color:var(--ink);border-radius:99px;margin-top:24px;padding:3px;font-weight:600;font-size:15px}
.grade span{flex:1;text-align:center;padding:8px 0;border-radius:99px}.grade span.on{background:var(--acc);outline:3px solid var(--ink);outline-offset:-3px}
.dx{left:16px;right:auto}
.ex{display:none!important}
.none{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:16px;opacity:.8;z-index:3}.none small{font-size:12px;opacity:.7}
.none[hidden]{display:none}
.hero .pic{filter:drop-shadow(0 18px 22px rgba(0,0,0,.35))}
</style></head><body>
<div id="app">
  <button class="dx" data-dx="1">&#215;</button>

</div>
<script src="../checkout.js"></script>
<script>
/* PRODUCTS
   Put each product picture (transparent PNG or WebP, background removed) in the images/ folder

const SB='https://fubhpawdzzjutsfzyzhz.supabase.co',SBK='sb_publishable_YCZHLx7xjXJtnwoJ7amhZg_NiHiJ0mm';
const D={list:[]};

const BG={};
async function load(){
 const cat=new URLSearchParams(location.search).get('cat')||'small-chops-snacks';

  const r=await fetch(SB+'/rest/v1/menu_items?select=name,price,image_url,description,available&category_id=eq.'+encodeURIComponent(cat)+'&order=created_at.asc',{headers:{apikey:SBK,Authorization:'Bearer '+SBK},signal:c.signal});clearTimeout(t);

  D.list=rows.map((x,i)=>{const p=PAL[i%PAL.length];BG[i+1]=p[0];return{id:i+1,img:x.image_url||"",name:x.name,p:Number(x.price)||0,d:x.description||"",c:p[1],sp:p[2],ing:"",g:0,cal:0,gr:2,sold:x.available===false?"Sold out":""}})
 }catch(e){}}
const money=n=>"\u20a6"+Math.round(n).toLocaleString("en-NG");const GR=["A+","A","B","C"];
function pic(it,w){if(!it.img)return donut(it,w);return `<img class="pic" src="${it.img}" alt="${it.name}" draggable="false" onerror="this.outerHTML=window.__d(${it.id},${w})">`}
window.__d=(id,w)=>donut(all().find(x=>x.id==id),w);
function rnd(s){return()=>(s=(s*16807)%2147483647)/2147483647}

 for(let i=0;i<260;i++){const an=r()*6.283,d=95+r()*85;const x=200+Math.cos(an)*d,y=200+Math.sin(an)*d,rot=r()*180;
  s+=it.id===3&&r()>.5?`<circle cx="${x}" cy="${y}" r="${2+r()*3}" fill="${it.sp}" opacity=".9"/>`:`<rect x="${x-9}" y="${y-2.2}" width="${it.id===2?10+r()*8:15}" height="${it.id===2?7:4}" rx="2" fill="${it.sp}" transform="rotate(${rot} ${x} ${y})" opacity=".92"/>`}
 return `<svg viewBox="0 0 400 400"><defs><mask id="m${it.id}${w}"><rect width="400" height="400" fill="#fff"/><circle cx="200" cy="200" r="52" fill="#000"/></mask><radialGradient id="g${it.id}${w}" cx="45%" cy="38%" r="65%"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></radialGradient></defs>
 <g mask="url(#m${it.id}${w})"><circle cx="200" cy="200" r="190" fill="url(#g${it.id}${w})"/><circle cx="200" cy="200" r="185" fill="none" stroke="#0003" stroke-width="6"/>${s}</g><circle cx="200" cy="200" r="52" fill="none" stroke="#0004" stroke-width="5"/></svg>`}
const cart={};let tab="list",editId=null,cur=0,dt=false,moved=false;const fav={},draft={};
const $e=id=>document.getElementById(id),all=()=>[].concat(...Object.values(D));
const total=()=>Object.entries(cart).reduce((t,[id,q])=>t+q*all().find(x=>x.id==id).p,0),count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const T=()=>Math.round(parseFloat(getComputedStyle(document.documentElement).paddingTop)||0)+92;
function ctl(it){return it.sold?`<div class="sold">${it.sold}</div>`:`<div class="ctl" data-c="${it.id}"><button class="rb" data-inc="${it.id}">+</button><button class="rb dec" data-dec="${it.id}">&#8722;</button><div class="pill"><span class="knob" data-knob="${it.id}"><i></i><b class="qn"></b>&nbsp;<b class="qp"></b></span><span class="a"><span>Slide to add to cart</span><span class="chev"><i></i><i></i><i></i></span></span></div><span class="ck"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#17100d" stroke-width="2.5"><path d="M5 12l5 5 9-10"/></svg></span></div>`}
function render(){const st=$e("stage"),L=D[tab];cur=0;dt=false;$e("app").classList.remove("dt");$e("none").hidden=L.length>0;if(!L.length){st.innerHTML="";return}
 st.innerHTML=L.map(it=>`<div class="hero" data-hero="${it.id}">${pic(it,400)}</div>
 <div class="info" data-info="${it.id}"><div class="row"><span class="price">${money(it.p)}</span><button class="heart ${fav[it.id]?"on":""}" data-fav="${it.id}"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-8.5-9A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8.5 4C19 15.500 12 20 12 20z"/></svg></button></div>
 <div class="name ${it.sold?"s":""}">${it.name}</div><div class="desc">${it.d}</div><div class="cw" data-cw="${it.id}">${ctl(it)}</div>
 <div class="ex"><div><h4>Ingredients:</h4><div class="ing">${it.ing}</div><div class="ss">Serving Size (${it.g}g)</div><div class="ca">Calories ${it.cal}<small>Calories from Fat 100</small></div>
 <div class="grade" data-gid="${it.id}"><div class="gring" style="left:${(it.gr+.5)*25}%"><span>${GR[it.gr]}</span></div>${GR.map((g,i)=>`<button class="g ${i==it.gr?"on":""}" data-grade="${i}">${g}</button>`).join("")}</div><div class="gl">${["Excellent","Good","Average","Not that good"].map((g,i)=>`<span class="${i==it.gr?"on":""}">${g}</span>`).join("")}</div></div></div></div>`).join("");
 st.querySelectorAll(".hero").forEach(h=>{h.style.transition="none"});layout(0,true);void st.offsetWidth;st.querySelectorAll(".hero").forEach(h=>{h.style.transition=""});upd();L.forEach(it=>refCtl(it.id))}
function offs(k){const n=D[tab].length;let o=((k-cur)%n+n)%n;if(o>n/2)o-=n;return o}
const SPR="cubic-bezier(.34,1.56,.64,1)";
const tf=q=>`translate(${q.x}px,${q.y}px) scale(${q.s}) rotate(${q.r}deg)`;

 h.animate([{transform:tf(f),offset:0,easing:"ease-out"},{transform:tf(m),offset:.16,easing:SPR},{transform:tf(n),offset:1}],{duration:1150})}
function layout(drag=0,init=false){if(!D[tab].length)return;const A=$e("app"),H=A.clientHeight,W=A.clientWidth,S=Math.min(W*.86,400),t=T(),L=D[tab];
 const dn=H-140-t-S*.1,up=42-t-S*.9;const lim=Math.max(0,Math.min(Math.abs(drag),Math.abs(dn)))*Math.sign(drag);
 A.style.background=BG[L[cur].id]||"#7b5240";
 L.forEach((it,k)=>{const h=document.querySelector(`[data-hero="${it.id}"]`),f=document.querySelector(`[data-info="${it.id}"]`),o=offs(k);
  h.style.width=h.style.height=S+"px";h.style.top=t+"px";h.style.marginLeft=(-S/2)+"px";
  const po=h.dataset.off===undefined?o:+h.dataset.off,jump=!init&&Math.abs(o-po)>1,eff=o+lim/Math.abs(dn);
  let q;
  if(dt&&o===0)q={x:0,y:H*.115-(t+S/2),s:1.5,r:-180};
  else{let ty=(o===0?0:o>0?dn:up)+(dt?0:lim);if(Math.abs(o)>1)ty=o>0?dn+400:up-400;q={x:0,y:ty,s:Math.max(.8,1-.2*Math.min(1,Math.abs(dt?o:eff))),r:(dt?o:eff)*40}}
  setHero(h,q,!drag&&!init&&!jump);h.dataset.off=o;h.classList.toggle("cur",o===0);f.classList.toggle("cur",o===0);
  f.style.opacity=o===0?(Math.max(0,1-Math.abs(lim)/140)):0;
});
 if(!drag)document.querySelectorAll(".info").forEach(f=>f.style.opacity="")}
function go(d){const n=D[tab].length;if(n<2||dt)return;cur=(cur+d+n)%n;layout(0)}
function openDetail(){dt=true;$e("app").classList.add("dt");layout(0)}
function closeDetail(){dt=false;$e("app").classList.remove("dt");layout(0)}
function upd(){}
function refCtl(id){const it=all().find(x=>x.id==id),c=document.querySelector(`[data-c="${id}"]`);if(!c)return;const q=draft[id]||0;c.classList.toggle("on",q>0);if(q){c.querySelector(".qn").textContent=q;c.querySelector(".qp").textContent=money(q*it.p)}}
function addDone(c,id){const q=draft[id],k=c.querySelector(".knob"),it=all().find(x=>x.id==id);c.classList.add("done");
 setTimeout(()=>Checkout.add({key:"sc:"+it.name,n:it.name,p:it.p,img:it.img},q,c.querySelector(".ck"),()=>{draft[id]=0;c.classList.remove("done","on");k.style.transform="";c.querySelector(".pill").style.setProperty("--p",0)}),380)}
(()=>{let k=null,x0=0,w=0,x=0,pill=null;
 document.addEventListener("pointerdown",e=>{const n=e.target.closest("[data-knob]");if(!n)return;k=n;pill=n.parentElement;x0=e.clientX;w=pill.clientWidth-n.offsetWidth;x=0;n.classList.add("drag");n.setPointerCapture(e.pointerId)});
 document.addEventListener("pointermove",e=>{if(!k)return;x=Math.max(0,Math.min(w,e.clientX-x0));k.style.transform=`translateX(${x}px)`;pill.style.setProperty("--p",x/w)});
 const end=()=>{if(!k)return;const n=k,c=n.closest(".ctl");k=null;n.classList.remove("drag");
  if(x>w*.72){n.style.transform=`translateX(${w}px)`;pill.style.setProperty("--p",1);addDone(c,n.dataset.knob)}else{n.style.transform="";pill.style.setProperty("--p",0)}};
 document.addEventListener("pointerup",end);document.addEventListener("pointercancel",end)})();
/* drag / swipe */
(()=>{const st=$e("stage");let y0=null,t0=0;
 st.addEventListener("pointerdown",e=>{if(dt||e.target.closest("button,[data-knob]"))return;y0=e.clientY;t0=Date.now();moved=false});
 window.addEventListener("pointermove",e=>{if(y0===null)return;const d=e.clientY-y0;if(Math.abs(d)>8)moved=true;if(moved){$e("app").classList.add("drag");layout(d)}});
 window.addEventListener("pointerup",e=>{if(y0===null)return;const d=e.clientY-y0,v=Math.abs(d)/(Date.now()-t0+1);y0=null;$e("app").classList.remove("drag");
  if(moved&&(Math.abs(d)>60||v>.5))go(d<0?1:-1);else layout(0);setTimeout(()=>moved=false,50)});
 let lock=0;st.addEventListener("wheel",e=>{if(dt||Date.now()<lock)return;if(Math.abs(e.deltaY)>12){lock=Date.now()+650;go(e.deltaY>0?1:-1)}},{passive:true});
 addEventListener("keydown",e=>{if(e.key==="ArrowDown")go(1);if(e.key==="ArrowUp")go(-1);if(e.key==="Escape"&&dt)closeDetail()});
 addEventListener("resize",()=>layout(0))})();
document.addEventListener("click",e=>{const gb=e.target.closest("[data-grade]");if(gb){const i=+gb.dataset.grade,gd=gb.closest(".grade"),it=all().find(x=>x.id==gd.dataset.gid);it.gr=i;const r=gd.querySelector(".gring");r.style.left=(i+.5)*25+"%";r.firstChild.textContent=GR[i];gd.querySelectorAll(".g").forEach((b,j)=>b.classList.toggle("on",j===i));gd.nextElementSibling.querySelectorAll("span").forEach((b,j)=>b.classList.toggle("on",j===i));return}
const hr=e.target.closest(".hero");if(hr&&!moved&&hr.classList.contains("cur")){dt?closeDetail():openDetail();return}const t=e.target.closest("button");if(!t)return;const g=a=>t.dataset[a];
 
 if(g("inc")){draft[g("inc")]=(draft[g("inc")]||0)+1;refCtl(g("inc"))}
 else if(g("dec")){draft[g("dec")]=Math.max(0,(draft[g("dec")]||0)-1);refCtl(g("dec"))}
 
 else if(g("fav")){fav[g("fav")]=!fav[g("fav")];t.classList.toggle("on")}
 else if(g("dx"))closeDetail();








});
Checkout.init();Checkout.onChange(n=>$e("app").classList.toggle("has",n>0));
load().then(render);
</script></body></html>
