<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plate Builder</title>

<style>
:root{--ink:#14110f;--mute:#8d8a86;--gold:#ffc83d;--brown:#2e1414;--bg:#eef0f4}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(160deg,#f4f5f8,var(--bg));display:grid;place-items:center;font-family:"Source Serif 4",Georgia,serif;color:var(--ink)}
@media (prefers-color-scheme:dark){body{background:#1b1c20}}
.app{position:relative;width:min(100%,400px);height:min(100dvh,800px);background:#fff;border-radius:28px;box-shadow:0 30px 60px -20px rgba(30,30,60,.25);overflow:hidden;display:flex;flex-direction:column;align-items:center}
header{width:100%;display:flex;justify-content:space-between;padding:20px 22px 0}
header h1{font-size:26px;font-weight:600;text-align:center;line-height:1.1}
header p{font-size:13px;color:var(--mute);text-align:center;margin-top:5px}
.ico{background:none;border:0;cursor:pointer;color:var(--ink);width:32px;height:32px}
.ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.3}
.ico.on svg{fill:#e5484d;stroke:#e5484d}

.tray.boxed{--tray:var(--boxed);aspect-ratio:720/707;width:min(82vw,320px,37dvh)}
.tray.boxed .plate{display:none}
.tray.boxed::before{border-radius:0}
.tray::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--tray) center/100% 100%}
.plate{position:absolute;left:61%;top:50%;width:56cqw;height:56cqw;transform:translate(-50%,-50%) scale(0);border-radius:50%;background:#fff;box-shadow:0 5px 12px rgba(0,0,0,.35),inset 0 0 0 2px #ece8e2;z-index:1;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.plate.show{transform:translate(-50%,-50%) scale(1)}
.pool{position:absolute;left:calc(50% + var(--dx)*1cqw);top:calc(50% + var(--dy)*1cqw);width:calc(var(--d)*1cqw);height:calc(var(--d)*1cqw);transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.3),transparent 45%),var(--c);background-size:cover;transition:.35s;animation:drop .35s}
.layer{position:absolute;inset:0}
.piece{position:absolute;width:calc(var(--s)*1cqw);height:calc(var(--s)*1cqw);transform:translate(-50%,-50%);border-radius:50%;
 background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.5),transparent 48%),var(--c);background-size:cover;background-position:center;
 box-shadow:0 3px 6px rgba(0,0,0,.4);transition:left .3s,top .3s;animation:drop .35s cubic-bezier(.3,1.6,.5,1)}
.piece.protein{border-radius:38%;z-index:4}.piece.main{z-index:2}.piece.extra{z-index:3}
@keyframes drop{from{transform:translate(-50%,-150%) scale(1.5);opacity:0}}
.leaf{position:absolute;width:15px;height:8px;background:#4c9a3a;border-radius:100% 0;opacity:.9}

/* photos with the background removed: no blob, no circle, just the food */
.piece.img,.pool.img,.opt .dot.img{background-color:transparent;background-size:contain;background-repeat:no-repeat;background-position:center;border-radius:0;box-shadow:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.plate.img{background-color:transparent;background-size:100% 100%;box-shadow:none}
.price{font-size:30px;font-weight:600;margin-top:14px;flex:none}
.qty{display:flex;align-items:center;gap:14px;margin-top:8px;flex:none}
.step{width:38px;height:38px;border-radius:50%;border:0;background:var(--brown);color:#fff;box-shadow:0 8px 14px -6px rgba(46,20,20,.6);font:400 22px/1 system-ui,sans-serif;cursor:pointer}
.step:disabled{opacity:.35;cursor:default}
.meta{min-width:170px;text-align:center;font-size:15px;color:var(--mute)}
.tabs{position:relative;background:#fff;border-radius:30px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.09);margin-top:12px;flex:none}
.tl{position:relative;display:flex;gap:2px;z-index:1}
.liq{position:absolute;inset:4px;pointer-events:none}
.liq i{position:absolute;top:0;bottom:0;left:0;right:0;border-radius:30px;background:var(--gold);box-shadow:0 4px 12px rgba(255,200,61,.55)}
.liq.r i{transition:right .3s cubic-bezier(.3,1.5,.5,1),left .55s cubic-bezier(.3,1.25,.4,1) .06s}
.liq.l i{transition:left .3s cubic-bezier(.3,1.5,.5,1),right .55s cubic-bezier(.3,1.25,.4,1) .06s}
.liq.nt i{transition:none!important}
@keyframes squish{50%{transform:scaleY(.84)}}
.liq.go i{animation:squish .55s ease}
@keyframes swap{from{opacity:0;transform:translateX(calc(var(--dir)*36px))}}
.strip.swap{animation:swap .45s cubic-bezier(.3,1.3,.5,1)}
.tabs button{border:0;background:none;font:inherit;font-size:14px;color:var(--mute);padding:8px 14px;border-radius:30px;cursor:pointer;transition:.2s}
.tabs button.on{color:#3b2a00}
.chips{display:flex;gap:6px;max-width:100%;overflow-x:auto;padding:10px 16px 2px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid #eadfd2;background:#fff;border-radius:20px;font:inherit;font-size:12.5px;padding:5px 11px;color:var(--ink);cursor:pointer}
.chip.on{background:var(--gold);border-color:var(--gold);color:#3b2a00}
.hint{font-size:12.5px;color:var(--mute);padding:7px 0 0}

/* bottom: smile curve with accessories riding on it */
.foot{position:absolute;left:0;right:0;bottom:0;height:150px;background:#fafafa;overflow:hidden}
.curve{position:absolute;left:-20%;right:-20%;top:-58px;height:133px;background:#fff;border-radius:0 0 50% 50%/0 0 100% 100%;border-bottom:1px solid #d8c6c6}
.strip{position:absolute;left:0;right:0;bottom:91px;height:150px;display:flex;align-items:flex-end;overflow-x:auto;padding:0 18px;scrollbar-width:none;z-index:2}
.strip::-webkit-scrollbar{display:none}
.opt{flex:0 0 76px;scroll-snap-align:center;background:none;border:0;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transform-origin:50% 100%;will-change:transform}
.opt .dot{position:relative;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.5),transparent 48%),var(--c);background-size:cover;background-position:center;box-shadow:0 8px 14px -4px rgba(0,0,0,.35)}
.opt.in .dot{outline:3px solid var(--gold);outline-offset:3px}
.opt small{font-size:11px;color:var(--mute);white-space:nowrap}
.badge{position:absolute;right:-6px;top:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--gold);color:#3b2a00;font:600 12px/22px system-ui,sans-serif;text-align:center}
.cart{position:absolute;bottom:calc(31px + var(--ckh,0px));left:50%;transform:translate(-50%,26px) scale(.9);opacity:0;pointer-events:none;transition:.4s cubic-bezier(.3,1.5,.5,1);z-index:3;display:flex;align-items:center;gap:12px;border:0;background:var(--brown);color:#fff;font:inherit;font-size:15px;padding:15px 24px;border-radius:14px;box-shadow:0 14px 24px -8px rgba(46,20,20,.6);cursor:pointer;white-space:nowrap}
.cart.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.cart svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.6}
.toast{position:absolute;top:80px;left:50%;transform:translate(-50%,-20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <header>
    <button class="ico" id="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M20 12H5M11 6l-6 6 6 6"/></svg></button>
    <div><h1 id="title">Swallow</h1><p>Build your plate</p></div>
    <button class="ico" id="cartbtn" aria-label="Cart"><svg viewBox="0 0 24 24"><path d="M2 3h3l2.5 12h11l2-8H6.2"/><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/></svg></button>
  </header>

  <div class="tray" id="tray">
    <div class="plate" id="plate"><div id="pools"></div></div>
    <div class="layer" id="poolsT"></div>
    <div class="layer" id="layer"></div>
  </div>

  <div class="price" id="price">₦0</div>
  <div class="qty">
    <button class="step" id="minus" aria-label="Decrease">−</button>
    <div class="meta" id="meta"></div>
    <button class="step" id="plus" aria-label="Increase">+</button>
  </div>
  <nav class="tabs" id="tabs"><div class="liq" id="liq"><i></i></div><div class="tl" id="tl"></div></nav>
  <div class="chips" id="chips"></div>

  <div class="foot"><div class="curve" id="curve"></div></div>
  <div class="strip" id="strip"></div>
  <button class="cart" id="cart">
    <svg viewBox="0 0 24 24"><path d="M2 3h3l2.500 12h11l2-8H6.200"/><circle cx="9" cy="20" r="1.500"/><circle cx="17" cy="20" r="1.500"/></svg>
    Add to cart
  </button>
  <div class="toast" id="toast"></div>
</main>

<script src="../checkout.js"></script>
<script>
/* ---------- WHICH DISH: chosen before this page opens ----------
   open with  ?dish=swallow  or  ?dish=rice,  or set window.PLATE_DISH,
   or call PlateBuilder.setDish("rice") from your app. */
const CUR = "₦", MAX = 10;
const DISHES = {
  swallow:{title:"Swallow", tabs:[["main","Swallow"],["soup","Soup"],["protein","Protein"],["extra","Extras"]]},
  rice:   {boxed:true, title:"Rice",    tabs:[["main","Rice"],["protein","Protein"],["extra","Extras"]]},
  beans:  {boxed:true, like:"rice", title:"Beans", tabs:[["main","Beans"],["protein","Protein"],["extra","Extras"]]}
};
/* a dish with "like" also offers that dish's proteins and extras */
const has=i=>i.cat==="protein"||i.d.includes(DISH)||(i.cat!=="main"&&DISHES[DISH].like&&i.d.includes(DISHES[DISH].like));
const SIZE = {main:20, protein:12, extra:12};
/* set "img" to a photo URL later (transparent PNG works best) */
const S=["swallow"], R=["rice"], B=["beans"], SR=["swallow","rice"];
let ITEMS = [
  {id:"eba",     cat:"main",    d:S, name:"Eba",         unit:"wrap",   start:1, price:300, color:"#e8c24a", img:""},
  {id:"amala",   cat:"main",    d:S, name:"Amala",       unit:"wrap",   start:1, price:300, color:"#4a3426", img:""},
  {id:"pounded", cat:"main",    d:S, name:"Pounded yam", unit:"wrap",   start:1, price:400, color:"#f1e6cf", img:""},
  {id:"fufu",    cat:"main",    d:S, name:"Fufu",        unit:"wrap",   start:1, price:300, color:"#f6f0e2", img:""},
  {id:"semo",    cat:"main",    d:S, name:"Semo",        unit:"wrap",   start:1, price:300, color:"#e9d9a8", img:""},
  {id:"jollof",  cat:"main",    d:R, name:"Jollof rice", unit:"spoon",  start:2, price:150, color:"#e0592a", img:"", fill:1},
  {id:"beans",   cat:"main",    d:B, name:"Beans",       unit:"spoon",  start:2, price:150, color:"#8a5a3a", img:"", fill:1},
  {id:"white",   cat:"main",    d:R, name:"White rice",  unit:"spoon",  start:2, price:120, color:"#f1ede2", img:"", fill:1},
  {id:"fried",   cat:"main",    d:R, name:"Fried rice",  unit:"spoon",  start:2, price:170, color:"#d9a93a", img:"", fill:1},
  {id:"egusi",   cat:"soup",    d:S, name:"Egusi",       unit:"ladle",  start:1, price:500, color:"#b9a43a", img:"", fill:1},
  {id:"efo",     cat:"soup",    d:S, name:"Efo riro",    unit:"ladle",  start:1, price:500, color:"#2f6b2b", img:"", fill:1},
  {id:"ogbono",  cat:"soup",    d:S, name:"Ogbono",      unit:"ladle",  start:1, price:500, color:"#8a5a2b", img:"", fill:1},
  {id:"okra",    cat:"soup",    d:S, name:"Okra",        unit:"ladle",  start:1, price:500, color:"#4f8a2e", img:"", fill:1},
  {id:"beef",    cat:"protein", d:SR,name:"Beef",        unit:"piece",  start:1, price:200, color:"#7a3b22", img:""},
  {id:"goat",    cat:"protein", d:S, name:"Goat meat",   unit:"piece",  start:1, price:300, color:"#6a3220", img:""},
  {id:"ponmo",   cat:"protein", d:S, name:"Ponmo",       unit:"piece",  start:1, price:100, color:"#c9a27a", img:""},
  {id:"shaki",   cat:"protein", d:S, name:"Shaki",       unit:"piece",  start:1, price:150, color:"#e9dcc3", img:""},
  {id:"fish",    cat:"protein", d:SR,name:"Fish",        unit:"piece",  start:1, price:350, color:"#d08b3c", img:""},
  {id:"chicken", cat:"protein", d:R, name:"Chicken",     unit:"piece",  start:1, price:500, color:"#c9772e", img:""},
  {id:"turkey",  cat:"protein", d:R, name:"Turkey",      unit:"piece",  start:1, price:600, color:"#b86a2b", img:""},
  {id:"egg",     cat:"protein", d:R, name:"Boiled egg",  unit:"egg",    start:1, price:100, color:"#f4efe2", img:""},
  {id:"pepper",  cat:"extra",   d:S, name:"Pepper sauce",unit:"portion",start:1, price:100, color:"#b3321f", img:""},
  {id:"ewedu",   cat:"soup",   d:S, name:"Ewedu",       unit:"ladle" ,start:1, price:200, color:"#3c7a3a", img:"", fill:1},
  {id:"gbegiri", cat:"soup",   d:S, name:"Gbegiri",     unit:"ladle" ,start:1, price:200, color:"#c98a2e", img:"", fill:1},
  {id:"plantain",cat:"extra",   d:R, name:"Plantain",    unit:"portion",start:1, price:200, color:"#e8b52c", img:""},
  {id:"moimoi",  cat:"extra",   d:R, name:"Moi moi",     unit:"portion",start:1, price:250, color:"#d9a05a", img:""},
  {id:"slaw",    cat:"extra",   d:R, name:"Coleslaw",    unit:"portion",start:1, price:150, color:"#cfe0a5", img:""}
];

/* ---------- tray layout (percent of tray; everything stays on the flat wood) ---------- */
const MAIN_SLOTS=[[22,36],[29,25],[19,53],[28,47],[23,67],[31,62],[14,44],[33,36],[31,75],[34,52]];
const EXTRA_SLOTS=[[48,14],[62,12],[36,20],[44,86],[60,88],[30,80],[76,15],[78,86],[88,30],[88,70]];
const PC=[61,50];                                   // plate centre
const PROT=[[8,-6],[8,6],[19,-8],[19,8],[8,-18],[8,18],[20,0],[13,-12],[13,12],[14,0]];  // protein side (right of plate)
const POOL=[[[-12,0]],[[-12,-11],[-12,11]],[[-10,-16],[-14,0],[-10,16]],[[-8,-18],[-16,-6],[-16,6],[-8,18]]]; // soup side (left)
const POOLD=[26,20,17,14];
function inside(p,s){                               // never past the rim
  const dx=p[0]-50, dy=p[1]-50, d=Math.hypot(dx,dy), m=40-s/2;
  return d>m?[50+dx*m/d,50+dy*m/d]:p;
}

/* ---------- state ---------- */
let by=Object.fromEntries(ITEMS.map(i=>[i.id,i]));
const $=s=>document.querySelector(s);
let DISH=new URLSearchParams(location.search).get("dish")||window.PLATE_DISH||"swallow";
if(!DISHES[DISH]) DISH="swallow";
let sel={}, active=null, tab="main";
const unitText=(it,q)=>`${q} ${it.unit}${q>1?"s":""}`;

[[-14,6,20],[86,12,-30],[-8,70,60],[96,62,-60],[10,98,10],[80,100,-20]].forEach(([x,y,r])=>{
  const l=document.createElement("i");l.className="leaf";
  l.style.cssText=`left:${x}%;top:${y}%;transform:rotate(${r}deg)`;$("#tray").appendChild(l);
});

function moveLiq(first,dir){
  const b=$("#tl .on"), liq=$("#liq"), i=liq.firstElementChild; if(!b) return;
  if(first) liq.classList.add("nt"); else liq.className="liq "+(dir>0?"r":"l");
  i.style.left=b.offsetLeft+"px"; i.style.right=($("#tl").offsetWidth-b.offsetLeft-b.offsetWidth)+"px";
  if(first){ liq.offsetWidth; liq.classList.remove("nt"); }
  else { void liq.offsetWidth; liq.classList.add("go"); }
}
function setDish(name){
  if(!DISHES[name]) return;
  DISH=name; sel={}; active=null; tab=DISHES[name].tabs[0][0];
  $("#title").textContent=DISHES[name].title; $("#tray").classList.toggle("boxed",!!DISHES[name].boxed);
  $("#tl").innerHTML=DISHES[name].tabs.map(([id,l])=>`<button data-c="${id}" class="${id===tab?"on":""}">${l}</button>`).join("");
  moveLiq(true); $("#strip").scrollLeft=0; update();
}
$("#tabs").onclick=e=>{                              // liquid swap between Swallow / Soup / Protein / Extras
  const b=e.target.closest("button"); if(!b||b.dataset.c===tab) return;
  const kids=[...$("#tl").children], dir=kids.indexOf(b)>kids.indexOf($("#tl .on"))?1:-1;
  tab=b.dataset.c; kids.forEach(x=>x.classList.toggle("on",x===b)); moveLiq(false,dir);
  const s=$("#strip"); s.scrollLeft=0; renderStrip(); fx();
  s.style.setProperty("--dir",dir); s.classList.remove("swap"); void s.offsetWidth; s.classList.add("swap");
};
if(document.fonts) document.fonts.ready.then(()=>moveLiq(true));
addEventListener("resize",()=>moveLiq(true));

/* ---------- accessories riding the curve ---------- */
function renderStrip(){
  $("#strip").innerHTML=ITEMS.filter(i=>i.cat===tab&&has(i)).map(i=>`
    <button class="opt ${sel[i.id]?"in":""}" data-id="${i.id}">
      <span class="dot ${i.src?"img":""}" style="--c:${i.color};${i.src?`background-image:url('${i.src}')`:""}">${sel[i.id]?`<b class="badge">${sel[i.id]}</b>`:""}</span>
      <small>${i.name}</small></button>`).join("");
}
$("#strip").onclick=e=>{
  const b=e.target.closest(".opt"); if(!b) return;
  const id=b.dataset.id; if(!sel[id]) sel[id]=by[id].start;
  active=id; update();
};
function fx(){
  const s=$("#strip"), sr=s.getBoundingClientRect(), cv=$("#curve").getBoundingClientRect();
  const cx=cv.left+cv.width/2, rx=cv.width/2, mid=sr.left+sr.width/2;
  const line=x=>cv.top+cv.height*Math.sqrt(Math.max(0,1-((x-cx)/rx)**2));
  const y0=line(mid);
  [...s.children].forEach(o=>{
    const x=sr.left+o.offsetLeft-s.scrollLeft+o.offsetWidth/2;
    o.style.transform=`translateY(${line(x)-y0}px)`;
  });
}
$("#strip").addEventListener("scroll",()=>requestAnimationFrame(fx));
addEventListener("resize",fx);

/* ---------- + / − ---------- */
$("#plus").onclick=()=>{ if(active&&sel[active]<MAX){sel[active]++;update();} };
$("#minus").onclick=()=>{
  if(!active) return;
  if(--sel[active]<=0){ delete sel[active]; const k=Object.keys(sel); active=k.length?k[k.length-1]:null; }
  update();
};
$("#chips").onclick=e=>{ const c=e.target.closest(".chip"); if(c){active=c.dataset.id;update();} };

/* ---------- tray: one piece per unit picked ---------- */
function sync(parent,want,paint){
  [...parent.children].forEach(el=>{ if(!want.has(el.dataset.k)) el.remove(); });
  want.forEach((v,k)=>{
    let el=[...parent.children].find(e=>e.dataset.k===k);
    if(!el){ el=document.createElement("i"); el.dataset.k=k; parent.appendChild(el); }
    paint(el,v);
  });
}
const bgOf=it=>it.src?`background-image:url('${it.src}')`:"";
/* compartment tray (rice): each kind of food has its own place */
const ZONES={main:{x:50,y:74,w:88,h:42}, protein:{x:68,y:25,w:50,h:40}, extra:{x:21,y:26,w:33,h:41}};
const HW=707/720;
function gridPos(z,n,s){
  const step=s*.85, cols=Math.max(1,Math.floor(z.w*.9/step)), nc=Math.min(n,cols), nr=Math.ceil(n/cols);
  return k=>[z.x+(k%cols-(nc-1)/2)*step, z.y+(Math.floor(k/cols)-(nr-1)/2)*step/HW];
}
function renderTray(){
  const boxed=$("#tray").classList.contains("boxed"), lists={main:[],protein:[],extra:[]}, fills=[], want=new Map();
  Object.keys(sel).forEach(id=>{
    const it=by[id], q=sel[id];
    if(it.fill){ fills.push(it); return; }
    for(let i=0;i<q;i++) lists[it.cat].push({it,key:`${id}-${i}`});
  });
  Object.keys(lists).forEach(cat=>{
    const arr=lists[cat], at=boxed?gridPos(ZONES[cat],arr.length,SIZE[cat]*1.3):null;
    arr.forEach(({it,key},k)=>{
      const s=SIZE[cat]*(it.scale||1)*(boxed?1.3:1); let pos;
      if(boxed) pos=at(k);
      else pos=inside(cat==="main"?MAIN_SLOTS[k]:cat==="protein"?[PC[0]+PROT[k][0],PC[1]+PROT[k][1]]:EXTRA_SLOTS[k],s);
      want.set(key,{it,s,pos});
    });
  });
  sync($("#layer"),want,(el,v)=>{
    el.className=`piece ${v.it.cat} ${v.it.src?"img":""}`;
    el.style.cssText=`left:${v.pos[0]}%;top:${v.pos[1]}%;--s:${v.s};--c:${v.it.color};${bgOf(v.it)}`;
  });
  const pr=new Map(), pb=new Map(), n=Math.min(fills.length,4), z=ZONES.main, m=Math.min(fills.length,2);
  fills.forEach((it,i)=>{
    const g=Math.min(1,.7+.06*sel[it.id])*(it.scale||1);
    if(boxed){                                       // rice sits in the big compartment
      const base=Math.min(z.h*HW*.95,z.w*.95/m);
      pb.set(it.id,{it,pos:[z.x-50+((i%m)-(m-1)/2)*z.w*.95/m,(z.y-50)*HW],d:base*g});
    } else {                                         // soup sits on the left of the plate
      pr.set(it.id,{it,pos:POOL[n-1][i%n],d:POOLD[n-1]*Math.min(1.1,.85+.05*sel[it.id])*(it.scale||1)});
    }
  });
  const paint=(el,v)=>{ el.className=`pool ${v.it.src?"img":""}`; el.style.cssText=`--dx:${v.pos[0]};--dy:${v.pos[1]};--d:${v.d};--c:${v.it.color};${bgOf(v.it)}`; };
  sync($("#pools"),pr,paint); sync($("#poolsT"),pb,paint);
  $("#plate").classList.toggle("show",!boxed&&(pr.size>0||lists.protein.length>0));
}

function update(){
  renderTray(); renderStrip(); fx();
  const ids=Object.keys(sel);
  $("#price").textContent=CUR+ids.reduce((s,i)=>s+by[i].price*sel[i],0).toLocaleString();
  $("#meta").textContent=active?`${by[active].name} · ${unitText(by[active],sel[active])}`:"Pick from the bottom";
  $("#plus").disabled=!active||sel[active]>=MAX;
  $("#minus").disabled=!active;
  $("#cart").classList.toggle("show",ids.length>0);
  $("#chips").innerHTML=ids.length?ids.map(i=>`<button class="chip ${i===active?"on":""}" data-id="${i}">${by[i].name} · ${unitText(by[i],sel[i])}</button>`).join(""):`<span class="hint">Your tray is empty</span>`;
  $("#chips").style.justifyContent=ids.length>2?"flex-start":"center";
}
$("#cart").onclick=()=>{
  const items=Object.keys(sel).map(id=>({id,name:by[id].name,cat:by[id].cat,qty:sel[id],unit:by[id].unit,price:by[id].price}));
  const total=items.reduce((s,i)=>s+i.price*i.qty,0);
  window.dispatchEvent(new CustomEvent("plate:add",{detail:{dish:DISH,items,total}}));
  Checkout.add({key:"plate:"+DISH+":"+items.map(i=>i.id+"x"+i.qty).join(","),n:(DISH.charAt(0).toUpperCase()+DISH.slice(1))+" plate",p:total,img:""},1,$("#cart"));
  const t=$("#toast"); t.textContent="Plate added to cart"; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),1800);
};
$("#cartbtn").onclick=()=>{window.dispatchEvent(new CustomEvent("plate:opencart"));Checkout.open()};
Checkout.init();
$("#back").onclick=()=>{ window.dispatchEvent(new CustomEvent("plate:back")); if(window.parent===window&&history.length>1) history.back(); };
/* ---------- PHOTOS (background removed, PNG/WebP) ----------
   1. drop files in  images/<id>.png   e.g. images/eba.png, images/egusi.png, images/beef.png
      (images/plate.png and images/tray.png are optional and replace the plate and tray)
   2. or give URLs:  PlateBuilder.setImages({eba:"https://...", egusi:"https://..."})
   3. or load the whole menu from your admin:  PlateBuilder.setMenu([{id,cat,d,name,unit,start,price,color,img,fill,scale}, ...])
   Any item without a photo keeps its coloured blob. Add  scale:1.3  to an item to enlarge its photo. */
const IMG_BASE="images/";
function loadImages(){
  const map=window.PLATE_IMAGES||{};
  const get=(k,fn)=>{ const s=map[k]||IMG_BASE+k+".png", im=new Image(); im.onload=()=>fn(s); im.src=s; };
  ITEMS.forEach(it=>get(it.id,s=>{ it.src=map[it.id]||it.img||s; update(); }));
  get("plate",s=>{ const p=$("#plate"); p.classList.add("img"); p.style.backgroundImage=`url('${s}')`; });
  get("tray", s=>$("#tray").style.setProperty("--round",`url('${s}')`));
  get("tray-rice", s=>$("#tray").style.setProperty("--boxed",`url('${s}')`));
}
function setImages(map){ window.PLATE_IMAGES=Object.assign(window.PLATE_IMAGES||{},map); loadImages(); }
function setMenu(items){ ITEMS=items; by=Object.fromEntries(ITEMS.map(i=>[i.id,i])); setDish(DISH); loadImages(); }
window.PlateBuilder={setDish,setImages,setMenu};
setDish(DISH);
loadImages();
/* pictures uploaded in the admin (Plate builder tab) are stored in Supabase as menu_images keys "plate/<id>" */
(async()=>{
  try{
    const SB="https://fubhpawdzzjutsfzyzhz.supabase.co", K="sb_publishable_YCZHLx7xjXJtnwoJ7amhZg_NiHiJ0mm";
    const r=await fetch(SB+"/rest/v1/menu_images?select=key,image_url&key=like.plate%2F*",{headers:{apikey:K,Authorization:"Bearer "+K}});
    if(!r.ok) return;
    const m={}; (await r.json()).forEach(x=>{ if(x.image_url) m[x.key.slice(6)]=x.image_url; });
    if(Object.keys(m).length) setImages(m);
  }catch(e){}
