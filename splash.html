<style>
:root{--cream:#e9e0ca;--paper:#fbfaf6;--bg:#ffc629;--red:#c4271f;--dark:#160a08;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{display:grid;place-items:center;font-family:'Archivo Black',Impact,'Arial Black',sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent}
.stage{position:relative;z-index:3;width:min(100vw,80svh);aspect-ratio:4/5;container-type:inline-size}
.O{position:absolute;left:0;top:0;width:24cqw;height:24cqw;opacity:0;border-radius:50%;background:#ef6b2d;display:grid;place-items:center;overflow:hidden}
.av{position:absolute;left:2%;top:10%;width:96%;height:auto;display:block}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
#scene{position:fixed;left:50%;top:50%;width:min(100vw,56.25svh);aspect-ratio:9/16;container-type:inline-size;z-index:1}
#scene .p{position:absolute;aspect-ratio:1;border-radius:50%;filter:drop-shadow(-.5cqw .8cqw .55cqw rgba(15,5,0,.5));opacity:0;will-change:transform}
#scene .sh{position:absolute;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(15,5,0,1) 78%,rgba(15,5,0,0) 100%);filter:blur(.8cqw);opacity:0;will-change:transform}
#table{position:fixed;inset:0;background:#ef6b2d;z-index:0}
#red{position:fixed;inset:0;background:var(--red);z-index:2;pointer-events:none;
 -webkit-mask:radial-gradient(circle var(--r,9999px) at 50% 50%,transparent calc(var(--r,9999px) - 1px),#000 var(--r,9999px));
 mask:radial-gradient(circle var(--r,9999px) at 50% 50%,transparent calc(var(--r,9999px) - 1px),#000 var(--r,9999px))}
.words{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5cqw;opacity:0}
.word{display:flex;justify-content:space-between;align-items:baseline;width:88cqw;font-size:27cqw;line-height:1;color:var(--red);overflow:hidden;padding:.03em 0}
.c{display:inline-block}
.slot{display:inline-block;width:.76em;height:.76em}
#red2{position:fixed;inset:0;background:var(--red);z-index:2;pointer-events:none;opacity:0;
 -webkit-mask-image:linear-gradient(to top,transparent var(--w,-14%),#000 calc(var(--w,-14%) + 14%));
 mask-image:linear-gradient(to top,transparent var(--w,-14%),#000 calc(var(--w,-14%) + 14%))}

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" onerror="parent.postMessage('splash:done','*')"></script>
<script>
var IO='power3.inOut',OUT='power3.out',tl,stage=document.getElementById('s'),red=document.getElementById('red');
var st={r:9999},st2={w:-14},red2=document.getElementById('red2');
function render(){red.style.setProperty('--r',st.r+'px')}
function render2(){red2.style.setProperty('--w',st2.w+'%')}
function build(){
 if(tl)tl.kill();
 var sw=stage.clientWidth,big=Math.hypot(innerWidth,innerHeight)/2*1.1,hole=.23*sw;
 var slot=document.getElementById('slot'),O=document.querySelector('.O');
 var sr=stage.getBoundingClientRect(),sl=slot.getBoundingClientRect();
 O.style.width=O.style.height=sl.width+'px';O.style.left=(sl.left-sr.left)+'px';O.style.top=(sl.top-sr.top)+'px';
 var cx=(sr.left+sr.width/2)-(sl.left+sl.width/2),cy=(sr.top+sr.height/2)-(sl.top+sl.height/2),SC=2*hole/sl.width;
 tl=gsap.timeline({paused:true});
 var P=gsap.utils.toArray('#scene .p'),S=gsap.utils.toArray('#scene .sh');
 gsap.set('#scene',{xPercent:-50,yPercent:-50});
 tl.set(P,{opacity:0,scale:1.4,rotation:0},0);
 tl.set(S,{opacity:0},0);
 tl.set('#table',{opacity:1},0);
 tl.set('#scene',{opacity:1,scale:1},0);
 tl.set('#red',{opacity:1},0);
 tl.set('.O',{opacity:1,x:cx,y:cy,scale:0},0);
 tl.set('.words',{opacity:1},0);
 tl.set('.c',{yPercent:110},0);
 tl.fromTo(st,{r:big},{r:big,duration:.01,onUpdate:render,immediateRender:false},0);
 // 1. plates drop onto the table one after another, centre dish first
 var rot=[0,-7,6,-5,7,5,-6,4];
 P.forEach(function(p,i){
  tl.fromTo(p,{opacity:0,scale:1.4,rotation:rot[i]},{opacity:1,scale:1,rotation:0,duration:.75,ease:OUT,immediateRender:false},.2+i*.15);
  tl.fromTo(p,{opacity:0},{opacity:1,duration:.25,ease:'none',immediateRender:false},.2+i*.15);
  tl.fromTo(S[i],{opacity:0,scale:1.5,xPercent:-24,yPercent:30},{opacity:.55,scale:1.04,xPercent:-9,yPercent:11,duration:.75,ease:OUT,immediateRender:false},.2+i*.15);
 });
 // 2. step back from the peephole: hole shrinks to the logo circle, a slice of the table stays in view
 tl.to(st,{r:hole,duration:1.15,ease:IO,onUpdate:render},2.4);
 tl.to('#scene',{scale:.86,duration:1.15,ease:'power2.inOut'},2.4);
 // 3. the logo disc covers the hole
 tl.to('.O',{scale:SC,duration:.75,ease:IO},3.8);
 tl.set('#red2',{opacity:1},4.55); // solid red goes on top the moment the logo covers the hole
 tl.set('#scene',{opacity:0},4.6);
 tl.set('#table',{opacity:0},4.6);
 // 4. JEUN / KOYO rise in line by line while the logo glides into the last O; red gives way to the yellow page
 tl.to('.c',{yPercent:0,duration:.9,ease:'power3.out',stagger:.07},5.8);
 tl.to('.O',{scale:1,x:0,y:0,duration:1.3,ease:'power3.inOut'},5.4);
 // the red surface slides up and away with a soft edge, revealing the yellow (no cross-fade, so no muddy orange)
 tl.set('#red2',{opacity:0},0);
 tl.fromTo(st2,{w:-14},{w:-14,duration:.01,onUpdate:render2,immediateRender:false},0);
 tl.set('#red',{opacity:0},4.6);
 tl.to(st2,{w:100,duration:1.5,ease:'power3.inOut',onUpdate:render2},5.35);
 tl.call(function(){parent.postMessage('splash:done','*')},null,7.5);
}
var rz;addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(function(){if(tl){build();tl.progress(1)}},150)});
var b=document.body;function play(){if(tl)tl.restart();else parent.postMessage('splash:done','*')}
b.addEventListener('click',function(){parent.postMessage('splash:done','*')});
Promise.race([document.fonts.load('27px "Archivo Black"').catch(function(){}),new Promise(function(r){setTimeout(r,1200)})]).then(function(){build();play()});
</script>
